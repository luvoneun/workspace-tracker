<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="워크스페이스" />
<title>워크스페이스</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #18181b;
    --muted: #52525b;
    --accent: #2563eb;
    --on-fill: #ffffff; /* --accent·--urgent로 채운 배경 위 글자 */
    --urgent: #c93636;
    --warn: #a86100;
    --success: #237a4b;
    --done-bg: #f1f5f9;
    --text-xs: 11px;
    --text-sm: 12px;
    --text-base: 13px;
    --text-md: 14px;
    --text-lg: 15px;
    --radius-sm: 8px;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --card: #1b1f27;
      --border: #303640;
      --text: #f3f4f6;
      --muted: #aaaab2;
      --accent: #7aa2ff;
      --on-fill: #0b1020;
      --urgent: #ff9292;
      --warn: #ffc46b;
      --success: #74d69a;
      --done-bg: #171a20;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
    }
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", "Segoe UI", sans-serif;
    line-height: 1.5;
    word-break: keep-all; /* 한글은 단어 중간이 아니라 띄어쓰기에서 줄을 바꾼다 */
    overflow-wrap: break-word;
  }
  .page { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  /* Notion/Linear/Raycast처럼 — 검색은 헤더 정중앙에 "입력창처럼 생긴" 트리거 버튼으로 두고,
     누르면 이미 있는 전체화면 검색으로 연결한다. 제목 길이가 바뀌어도 가운데를 유지하려고
     3칸 그리드로 짠다(1fr 검색 1fr) — 제목/톱니는 각자 칸의 바깥쪽으로 붙는다. */
  .page-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; }
  .page-header h1 { justify-self: start; }
  .page-header .settings-btn { justify-self: end; }
  .search-pill {
    justify-self: center; display: inline-flex; align-items: center; gap: 6px;
    font: inherit; font-size: var(--text-base); color: var(--muted);
    background: var(--card); border: 1px solid var(--border); border-radius: 999px;
    padding: 8px 16px; min-width: 160px; cursor: pointer;
    transition: border-color 120ms ease, color 120ms ease;
  }
  .search-pill:hover { border-color: var(--accent); color: var(--text); }
  @media (max-width: 520px) {
    .search-pill { min-width: 0; padding: 8px 10px; }
    .search-pill-text { display: none; }
  }
  .skip-link { position: absolute; left: 12px; top: -48px; z-index: 70; padding: 10px 14px; border-radius: var(--radius-sm); background: var(--accent); color: var(--on-fill); font-size: var(--text-md); font-weight: 600; text-decoration: none; }
  .skip-link:focus { top: 12px; }
  #todayTaskZone:focus { outline: none; }
  .icon { width: 1em; height: 1em; display: block; flex-shrink: 0; }
  .settings-btn, .refresh-btn, .pull-indicator { display: grid; place-items: center; }
  .search-pill .icon { width: 14px; height: 14px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .settings-btn {
    position: relative;
    width: 30px; height: 30px; line-height: 1; font-size: var(--text-lg);
    color: color-mix(in srgb, var(--muted) 60%, transparent);
    background: none; border: none; border-radius: 50%; cursor: pointer;
    flex-shrink: 0; transition: color 120ms ease, background 120ms ease;
  }
  .settings-btn:hover { color: var(--text); background: var(--card); }
  /* 열어보지 않아도 "확인할 게 있다"는 걸 알 수 있게 */
  .settings-btn.has-alert::after {
    content: ''; position: absolute; top: 2px; right: 2px;
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--urgent); border: 1.5px solid var(--bg);
  }

  .settings-dialog {
    width: min(560px, calc(100vw - 32px)); max-height: 82dvh; box-sizing: border-box;
    padding: 24px; border: 1px solid var(--border); border-radius: 16px;
    background: var(--bg); color: var(--text);
  }
  .settings-dialog::backdrop { background: #10182866; }
  .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .settings-head h2 { font-size: 18px; margin: 0; }
  .settings-dialog .wr-view-tabs { margin-bottom: 14px; }

  .automation-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .automation-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .automation-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .automation-card.has-failure .automation-dot { background: var(--urgent); }
  .automation-name { font-weight: 700; font-size: var(--text-base); }
  .automation-time { font-size: var(--text-xs); color: var(--muted); margin-left: auto; }
  .automation-summary { font-size: var(--text-sm); color: var(--muted); line-height: 1.5; }
  .automation-failures { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .automation-failure-row { font-size: var(--text-xs); color: var(--urgent); line-height: 1.6; }
  .automation-failure-row.muted { color: var(--muted); }
  .automation-past-failures { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .automation-past-failures summary { color: var(--muted); cursor: pointer; font-size: var(--text-xs); font-weight: 600; }
  .automation-log-toggle { margin-top: 8px; }
  .automation-log-toggle summary { color: var(--muted); cursor: pointer; font-size: var(--text-xs); font-weight: 600; }
  .automation-log-tail { margin: 8px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: ui-monospace, monospace; font-size: var(--text-xs); line-height: 1.6; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto; }

  .settings-guide dt { font-weight: 700; font-size: var(--text-base); margin: 16px 0 4px; }
  .settings-guide dt:first-child { margin-top: 0; }
  .settings-guide dd { margin: 0; font-size: var(--text-sm); color: var(--muted); line-height: 1.6; }
  @media (max-width: 600px) { .settings-dialog { padding: 16px; } }
  .date-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .date-bar-info { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .refresh-btn {
    width: 26px;
    height: 26px;
    line-height: 1;
    font-size: var(--text-lg);
    color: color-mix(in srgb, var(--muted) 60%, transparent);
    background: none;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: color 120ms ease, transform 400ms var(--ease-out);
  }
  .refresh-btn:hover { color: var(--text); background: var(--bg); }
  .refresh-btn.spinning { transform: rotate(360deg); color: var(--accent); }

  /* 당겨서 새로고침 — 화면 맨 위에서 아래로 끌면 나타난다 */
  body { overscroll-behavior-y: contain; }
  .pull-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    z-index: 60;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--text-lg);
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-40px);
  }
  .pull-indicator.snapping { transition: transform 260ms var(--ease-out), opacity 260ms var(--ease-out); }
  .pull-indicator.ready { color: var(--accent); border-color: var(--accent); }
  .pull-indicator.refreshing { color: var(--accent); animation: pull-spin 700ms linear infinite; }
  @keyframes pull-spin { to { transform: translateY(var(--pull-y, 56px)) rotate(360deg); } }
  .date-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: var(--text-base);
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
  }
  .date-chip .dow {
    font-weight: 500;
    opacity: 0.75;
  }
  .date-chip.muted {
    background: var(--border);
    color: var(--muted);
    font-weight: 500;
  }
  .date-chip.stale {
    background: color-mix(in srgb, var(--warn) 15%, transparent);
    color: var(--warn);
  }
  .sync-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-left: 8px;
    font-size: var(--text-xs);
    font-weight: 600;
    padding: 6px 12px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    color: var(--warn);
    cursor: help;
  }
  .sync-chip::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    position: relative;
    font-family: inherit;
    font-size: var(--text-md);
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 4px 10px;
    margin-right: 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 120ms ease, border-color 120ms ease;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-dot {
    display: none;
    position: absolute;
    top: 4px;
    right: -6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  .tab-btn.has-new .tab-dot { display: block; }

  .grid {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 300px;
    gap: 20px;
    align-items: start;
  }
  .grid[hidden] { display: none; }
  #gridToday:not(.planning-mode) { grid-template-columns: 260px minmax(0, 1fr); }
  #gridToday:not(.planning-mode) #laterTaskZone { display: none; }
  #gridToday.planning-mode { grid-template-columns: 260px minmax(0, 1fr) 300px; }
  .planning-toggle {
    margin-left: auto;
    font-family: inherit;
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 0;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
  }
  .col-left, .col-right { min-width: 0; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .grid-2col { grid-template-columns: 320px minmax(0, 1fr); }
  .col-narrow, .col-wide { min-width: 0; }
  #decisionArchiveZone { margin-top: 16px; }

  .wr-layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  .wr-layout[hidden] { display: none; }
  @media (max-width: 900px) {
    .wr-layout { grid-template-columns: 1fr; }
  }
  .wr-sidebar { min-width: 0; }
  .wr-detail { min-width: 0; }
  #weeklyReportNav { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .wr-nav-btn {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    font-family: inherit;
    color: var(--muted);
    background: none;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .wr-nav-btn:hover { background: var(--card); }
  .wr-nav-btn.active { color: var(--text); background: var(--card); box-shadow: var(--shadow); }
  .wr-nav-week { font-size: var(--text-base); font-weight: 700; }
  .wr-nav-range { font-size: var(--text-xs); font-weight: 500; color: var(--muted); }
  .wr-nav-btn.active .wr-nav-range { color: var(--muted); }
  .wr-detail-heading { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .wr-detail-week { font-size: 18px; font-weight: 700; }
  .wr-detail-range { font-size: var(--text-base); font-weight: 500; color: var(--muted); }

  .stats { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .stat {
    flex: 1;
    min-width: 110px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
  }
  .stat-num { display: block; font-size: 22px; font-weight: 700; line-height: 1.25; }
  .stat-label { font-size: var(--text-sm); color: var(--muted); }
  .stat.urgent .stat-num { color: var(--urgent); }
  .stat.urgent.zero .stat-num { color: var(--text); }

  h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--text);
    margin: 28px 0 10px;
  }
  h2::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .col-center h2::before { background: var(--accent); }
  h2.accent::before { background: var(--accent); }
  #reminderZone.urgent h2::before { background: var(--urgent); }
  #reminderZone.warn h2::before { background: var(--warn); }
  #waitingZone h2::before { background: var(--warn); }
  .section-count {
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--muted);
    background: var(--border);
    padding: 1px 8px;
    border-radius: 999px;
  }
  .card {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 12px;
    transition: opacity 0.15s, box-shadow 0.15s;
  }
  .card:has(.overflow-menu) { padding-right: 44px; }

  .overflow-menu { position: absolute; top: 10px; right: 10px; }
  .overflow-btn {
    width: 26px;
    height: 26px;
    line-height: 1;
    font-size: var(--text-md);
    font-weight: 600;
    color: color-mix(in srgb, var(--muted) 55%, transparent);
    background: none;
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }
  .overflow-btn:hover { background: var(--bg); color: var(--text); }
  .overflow-list {
    position: absolute;
    top: 30px;
    right: 0;
    z-index: 10;
    min-width: 210px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .overflow-list[hidden] { display: none; }
  .overflow-item {
    text-align: left;
    font-family: inherit;
    font-size: var(--text-base);
    font-weight: 500;
    color: var(--text);
    background: none;
    border: none;
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    cursor: pointer;
  }
  .overflow-item:hover { background: var(--bg); }
  .overflow-item:disabled { color: var(--muted); cursor: default; }
  .overflow-item:disabled:hover { background: none; }
  .overflow-item.danger { color: var(--urgent); }
  .overflow-date-wrap, .overflow-field { padding: 6px 10px 4px; }
  .overflow-date-label, .overflow-field-label { font-size: var(--text-xs); font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .overflow-sep { height: 1px; background: var(--border); margin: 6px 4px; }
  .overflow-field .jira-control, .overflow-field .priority-control { margin: 0; }
  .overflow-field .jira-select, .overflow-field select, .overflow-field input { width: 100%; box-sizing: border-box; max-width: none; }
  .overflow-field .badge {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .overflow-date-input {
    width: 100%;
    font-family: inherit;
    font-size: var(--text-base);
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
  }
  .overflow-date-input:focus { outline: none; border-color: var(--accent); }
  .card.done { background: var(--done-bg); opacity: 0.72; box-shadow: none; }
  #waitingList .card { border-radius: 10px; box-shadow: none; padding: 10px 12px; margin-bottom: 6px; }
  #waitingList .card .badges { margin-top: 4px; }
  .card.list-row { padding: 16px 18px; }
  .checkbox {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }
  .checkbox:disabled { cursor: not-allowed; opacity: 0.35; }
  /* 일괄 선택용 체크박스 — "완료" 체크박스랑 같은 자리에, 같은 모양으로 뜨니까
     지금 누르면 완료 처리되는 건지 선택되는 건지 헷갈리고 무서워진다는 얘기를 들었다.
     네모난 모양 + 테두리로 눈에 띄게 다르게 만들고, 카드 배경도 같이 물들여서
     "이건 완료가 아니라 선택"이라는 게 바로 보이게 한다. */
  .checkbox.task-selection {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; margin-top: 2px;
    border: 2px solid var(--border); border-radius: 6px;
    background: var(--card); position: relative;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .checkbox.task-selection:checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.task-selection:checked::after {
    content: ''; position: absolute; left: 5px; top: 1px;
    width: 5px; height: 9px; border: solid var(--on-fill); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .card.batch-selected { background: color-mix(in srgb, var(--accent) 8%, var(--card)); border-color: var(--accent); }
  .body { flex: 1; min-width: 0; }
  .top-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .sender { font-weight: 600; font-size: var(--text-md); }
  .desc-editable { cursor: text; border-radius: 4px; }
  .desc-editable:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .desc-edit-input {
    font-family: inherit;
    font-weight: 600;
    font-size: var(--text-md);
    color: var(--text);
    border: none;
    border-bottom: 1px solid var(--accent);
    background: none;
    padding: 0;
    flex: 1;
    min-width: 0;
  }
  .desc-edit-input:focus { outline: none; }
  .meta { color: color-mix(in srgb, var(--muted) 65%, transparent); font-size: var(--text-xs); white-space: nowrap; }
  .summary {
    font-size: var(--text-md);
    line-height: 1.45;
    word-break: break-word;
  }
  .card.done .summary, .card.done .sender, .card.done .desc { text-decoration: line-through; text-decoration-color: var(--muted); }
  .channel {
    display: inline-block;
    font-size: var(--text-xs);
    color: var(--accent);
    margin-top: 6px;
  }
  a.link { color: inherit; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) {
    a.link:hover { text-decoration: underline; }
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }

  .desc-editable:hover::after, .desc-editable:focus-visible::after { content: ' ✎'; color: var(--accent); }
  .group-add { margin: 0 0 10px; }
  .group-add summary { color: var(--muted); cursor: pointer; font-size: var(--text-sm); padding: 4px 0; }
  .group-add input { margin-top: 4px; }
  /* 스낵바 — 예전엔 브라우저 기본 버튼(각진 회색)을 그대로 썼더니 앱의 둥근 알약 버튼과
     확 튀었다. 액션은 .convert-btn과 같은 모양으로, 닫기는 그보다 옅은 보조 버튼으로 구분한다. */
  .status-notice {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;
    max-width: calc(100% - 32px); width: max-content;
    display: flex; align-items: center; flex-wrap: wrap; gap: 2px 4px;
    padding: 8px 8px 8px 16px;
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 14px; box-shadow: var(--shadow); font-size: var(--text-base);
  }
  .status-notice.error { border-color: var(--urgent); }
  .status-notice .convert-btn { margin: 0; flex-shrink: 0; }
  .notice-dismiss {
    font: inherit; font-size: var(--text-sm); color: var(--muted); background: none; border: none;
    border-radius: 999px; padding: 6px 10px; margin: 0; cursor: pointer; flex-shrink: 0;
    transition: background 120ms ease, color 120ms ease;
  }
  .notice-dismiss:hover { background: var(--bg); color: var(--text); }
  .notice-hint { font-size: var(--text-xs); color: var(--muted); flex-shrink: 0; }
  /* 복구 필요 안내 — 스낵바와 같은 재료를 쓰되 스스로 사라지지 않게 문서 흐름에 둔다. */
  .storage-banner {
    display: flex; align-items: baseline; flex-wrap: wrap; gap: 2px 6px;
    margin: 0 0 12px; padding: 10px 14px;
    background: var(--card); color: var(--text);
    border: 1px solid var(--urgent); border-radius: 12px; font-size: var(--text-base);
  }
  .sync-note, .report-note { font-size: var(--text-sm); color: var(--muted); margin: 6px 0 12px; overflow-wrap: anywhere; }
  .card[aria-busy="true"] { opacity: .65; pointer-events: none; }
  @media (max-width: 900px) {
    .grid, .grid-2col, .wr-layout { grid-template-columns: minmax(0, 1fr); }
    #gridToday:not(.planning-mode), #gridToday.planning-mode { grid-template-columns: minmax(0, 1fr); }
    #gridToday .col-center { order: -1; }
    #gridToday.planning-mode #laterTaskZone { display: block; }
    #gridToday:not(.planning-mode) #laterTaskZone { display: none; }
    .page { padding: 20px 16px 80px; }
    .stats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .stat { min-width: 0; padding: 12px 10px; }
    .overflow-btn { width: 36px; height: 36px; }
    input, select { max-width: 100%; }
    .quick-add input, .wr-add-input, .desc-edit-input, .who-edit-input, .group-input { font-size: 16px; }
    .calendar-event { flex-wrap: wrap; }
  }

  /* Product visual direction: calm, flat, task-first workbench. */
  .stat, #calendarZone, .task-detail, .wr-nav-btn.active { box-shadow: none; }
  .stat, #calendarZone { border-radius: 12px; }
  .card:not(.task-row) { border-radius: 12px; box-shadow: none; }
  .tab-btn, .planning-toggle, .wr-view-btn, .detail-action, .convert-btn { transition: background-color 150ms ease, color 150ms ease, transform 120ms ease; }
  button:active, .tab-btn:active { transform: scale(.98); }
  .sender { letter-spacing: -0.01em; }
  .task-row .meta { font-size: var(--text-xs); color: color-mix(in srgb, var(--muted) 65%, transparent); }
  .task-row .badges { margin-top: 4px; }
  .badge.overdue::before, .badge.due-today::before, .badge.priority-critical::before { content: none; }
  /* 채운 강조 상태: 파랑(행동·선택) / 빨강(삭제). 글자색은 --on-fill이 라이트·다크에서 맞춰 준다. */
  .planning-toggle:hover, .planning-toggle[aria-pressed="true"], .inbox-btn:hover, .convert-btn:hover, .wr-view-btn.active { color: var(--on-fill); background: var(--accent); }
  .inbox-btn.danger:hover, .convert-btn.danger:hover { color: var(--on-fill); background: var(--urgent); }
  .checkbox { width: 22px; height: 22px; }
  @media (pointer: coarse) {
    .checkbox, .checkbox.task-selection { width: 28px; height: 28px; }
    .checkbox.task-selection:checked::after { left: 8px; top: 3px; width: 6px; height: 12px; }
  }
  .quick-add input, .wr-add-input { min-height: 44px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

</style>
<link rel="stylesheet" href="/workflows.css">
<link rel="stylesheet" href="/report-ui.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#todayTaskZone">오늘 할 일로 건너뛰기</a>
  <div class="pull-indicator" id="pullIndicator" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>
  <div class="page">
    <div class="page-header">
      <h1 id="workspaceTitle">워크스페이스</h1>
      <button type="button" id="searchEntryBtn" class="search-pill" aria-label="통합 검색" title="검색">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span class="search-pill-text">검색...</span>
      </button>
      <button type="button" id="settingsBtn" class="settings-btn" aria-label="환경설정" title="환경설정"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div id="storageBanner" class="storage-banner" role="status" hidden></div>
    <div class="date-bar">
      <span id="dateBar" class="date-bar-info"></span>
      <button type="button" id="refreshBtn" class="refresh-btn" aria-label="새로고침" title="새로고침"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
    </div>

    <div class="tab-bar" role="tablist">
      <button type="button" class="tab-btn" id="tabBtnToday" role="tab">오늘</button>
      <button type="button" class="tab-btn" id="tabBtnRecords" role="tab">아이디어·결정<span class="tab-dot" aria-hidden="true"></span></button>
      <button type="button" class="tab-btn" id="tabBtnWeekly" role="tab">주간요약</button>
    </div>

    <div class="grid" id="gridToday">
      <aside class="col col-left">
        <div class="stats">
          <div class="stat"><span class="stat-num" id="decisionCount">0</span><span class="stat-label">정책 검토</span></div>
          <div class="stat"><span class="stat-num" id="waitingCount">0</span><span class="stat-label">확인 대기</span></div>
          <div class="stat"><span class="stat-num" id="createdTodayCount">0</span><span class="stat-label">오늘 신규</span></div>
        </div>

        <div id="calendarZone">
          <h2>오늘 미팅<span class="section-count" id="calendarSectionCount">0</span></h2>
          <div id="calendarList"></div>
        </div>

        <div id="reminderZone" hidden>
          <h2 id="reminderHeading">리마인드<span class="section-count" id="reminderSectionCount">0</span></h2>
          <div id="reminderList"></div>
        </div>

        <div id="waitingZone">
          <h2 id="waitingHeading">확인 대기중<span class="section-count" id="waitingSectionCount">0</span></h2>
          <div class="quick-add">
            <input type="text" id="waitingInput" placeholder="확인 대기 추가…" aria-label="확인 대기 추가" />
          </div>
          <div id="waitingList"></div>
        </div>
      </aside>

      <main class="col col-center">
        <div id="inboxZone" hidden>
          <h2 id="inboxHeading">새로 들어온 것<span class="section-count" id="inboxCount">0</span></h2>
          <div id="inboxList"></div>
        </div>

        <div id="todayTaskZone" tabindex="-1">
          <h2>오늘 할 일<span class="section-count" id="todayTaskCount">0</span><span class="plan-summary plan-only" id="todayDoneSummary"></span><button type="button" class="planning-toggle" id="planningToggle" aria-pressed="false">계획·정리</button></h2>
          <div class="today-toolbar">
            <label class="view-select">보기 <select id="todayViewSelect" aria-label="오늘 할 일 정렬 방식"><option value="project">프로젝트별</option><option value="priority">마감·중요도순</option></select></label>
          </div>
          <div id="suggestZone" hidden>
            <div class="suggest-head">
              <span id="suggestTitle"></span>
              <button type="button" class="suggest-dismiss" id="suggestDismiss">오늘은 괜찮아요</button>
            </div>
            <div id="suggestList"></div>
          </div>
          <div class="quick-add">
            <input type="text" id="todayTaskInput" placeholder="무엇을 해야 하나요? Enter로 추가" aria-label="오늘 할 일 추가" />
          </div>
          <div class="task-content-layout">
            <div id="todayTaskList"></div>
            <aside id="taskDetailPanel" class="task-detail" hidden aria-label="선택한 업무 상세"></aside>
          </div>
        </div>
      </main>

      <aside class="col col-right">
        <details class="done-details" id="laterTaskZone">
          <summary>나중에 할 일<span class="section-count" id="laterTaskSectionCount">0</span></summary>
          <div class="quick-add">
            <input type="text" id="laterTaskInput" placeholder="나중에 할 일 추가…" aria-label="나중에 할 일 추가" />
          </div>
          <div id="laterTaskList"></div>
        </details>
      </aside>
    </div>

    <div class="grid grid-2col" id="gridRecords" hidden>
      <aside class="col col-narrow">
        <details class="done-details" open>
          <summary>언젠가<span class="section-count" id="ideaCount">0</span></summary>
          <div class="quick-add">
            <input type="text" id="ideaInput" placeholder="언젠가 메모 추가…" aria-label="언젠가 할 일 메모 추가" />
          </div>
          <div id="ideaList"></div>
        </details>
      </aside>

      <main class="col col-wide">
        <details class="done-details" open>
          <summary>정책/얼라인<span class="section-count" id="decisionSectionCount">0</span></summary>
          <div class="quick-add">
            <input type="text" id="decisionInput" placeholder="정해진 내용 추가…" aria-label="정책/얼라인 추가" />
          </div>
          <div id="decisionList"></div>
        </details>
        <details class="done-details" id="decisionArchiveZone">
          <summary>반영 완료<span class="section-count" id="decisionArchiveCount">0</span></summary>
          <div class="quick-add">
            <input type="search" id="decisionArchiveSearch" placeholder="지난 결정 검색 (내용, 그룹, 지라)" aria-label="반영 완료한 결정 검색" autocomplete="off" />
          </div>
          <div id="decisionArchiveList"></div>
        </details>
      </main>
    </div>

    <div class="wr-layout" id="gridWeekly" hidden>
      <aside class="wr-sidebar">
        <h2>주간 요약<span class="section-count" id="weeklyReportCount">0</span></h2>
        <div id="weeklyReportNav"></div>
      </aside>
      <main class="wr-detail" id="weeklyReportDetail"></main>
    </div>
  </div>

  <div id="liveRegion" class="status-notice" role="status" aria-live="polite" hidden></div>

  <dialog id="settingsDialog" class="settings-dialog" aria-label="환경설정">
    <div class="settings-head">
      <h2>환경설정</h2>
      <button type="button" id="settingsCloseBtn" class="notice-dismiss" aria-label="닫기">닫기</button>
    </div>
    <div class="wr-view-tabs">
      <button type="button" class="wr-view-btn active" data-settings-tab="status">상태</button>
      <button type="button" class="wr-view-btn" data-settings-tab="guide">사용법</button>
    </div>
    <div id="settingsStatusView"></div>
    <div id="settingsGuideView" hidden></div>
  </dialog>

<script src="/workflows.js"></script>
<script src="/report-ui.js"></script>
<script src="/app.js"></script>
</body>
</html>
