<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f8fafc" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#111318" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="워크스페이스" />
<title>워크스페이스</title>
<style>
  /* 토큰·리셋·헤더·탭·배너·알림 등 공용 부품은 /ui.css에 있다.
     아래는 아직 새 모양으로 바꾸지 않은 화면의 옛 규칙이다(배치마다 구역별로 사라진다). */
  .settings-dialog {
    width: min(560px, calc(100vw - 32px)); max-height: 82dvh; box-sizing: border-box;
    padding: 24px; border: 1px solid var(--border); border-radius: 16px;
    background: var(--bg); color: var(--text);
  }
  .settings-dialog::backdrop { background: #10182866; }
  .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .settings-head h2 { font-size: 18px; margin: 0; }
  .settings-dialog .wr-view-tabs { margin-bottom: 14px; }

  .automation-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .automation-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .automation-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .automation-card.has-failure .automation-dot { background: var(--urgent); }
  .automation-name { font-weight: 700; font-size: var(--text-base); }
  .automation-time { font-size: var(--text-xs); color: var(--muted); margin-left: auto; }
  .automation-summary { font-size: var(--text-sm); color: var(--muted); line-height: 1.5; }
  .automation-failures { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .automation-failure-row { font-size: var(--text-xs); color: var(--urgent); line-height: 1.6; }
  .automation-failure-row.muted { color: var(--muted); }
  .automation-past-failures { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .automation-past-failures summary { color: var(--muted); cursor: pointer; font-size: var(--text-xs); font-weight: 600; }
  .automation-log-toggle { margin-top: 8px; }
  .automation-log-toggle summary { color: var(--muted); cursor: pointer; font-size: var(--text-xs); font-weight: 600; }
  .automation-log-tail { margin: 8px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); font-family: ui-monospace, monospace; font-size: var(--text-xs); line-height: 1.6; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto; }

  .settings-guide dt { font-weight: 700; font-size: var(--text-base); margin: 16px 0 4px; }
  .settings-guide dt:first-child { margin-top: 0; }
  .settings-guide dd { margin: 0; font-size: var(--text-sm); color: var(--muted); line-height: 1.6; }
  @media (max-width: 600px) { .settings-dialog { padding: 16px; } }

  /* 당겨서 새로고침 — 화면 맨 위에서 아래로 끌면 나타난다 */
  .pull-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    z-index: 60;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--text-lg);
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-40px);
  }
  .pull-indicator.snapping { transition: transform 260ms var(--ease-out), opacity 260ms var(--ease-out); }
  .pull-indicator.ready { color: var(--accent); border-color: var(--accent); }
  .pull-indicator.refreshing { color: var(--accent); animation: pull-spin 700ms linear infinite; }
  @keyframes pull-spin { to { transform: translateY(var(--pull-y, 56px)) rotate(360deg); } }

  .grid {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 300px;
    gap: 20px;
    align-items: start;
  }
  .grid[hidden] { display: none; }
  .col-left { min-width: 0; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .grid-2col { grid-template-columns: 320px minmax(0, 1fr); }
  .col-narrow, .col-wide { min-width: 0; }
  #decisionArchiveZone { margin-top: 16px; }

  .wr-layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  .wr-layout[hidden] { display: none; }
  @media (max-width: 900px) {
    .wr-layout { grid-template-columns: 1fr; }
  }
  .wr-sidebar { min-width: 0; }
  .wr-detail { min-width: 0; }
  #weeklyReportNav { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .wr-nav-btn {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    font-family: inherit;
    color: var(--muted);
    background: none;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .wr-nav-btn:hover { background: var(--card); }
  .wr-nav-btn.active { color: var(--text); background: var(--card); box-shadow: var(--shadow); }
  .wr-nav-week { font-size: var(--text-base); font-weight: 700; }
  .wr-nav-range { font-size: var(--text-xs); font-weight: 500; color: var(--muted); }
  .wr-nav-btn.active .wr-nav-range { color: var(--muted); }
  .wr-detail-heading { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .wr-detail-week { font-size: 18px; font-weight: 700; }
  .wr-detail-range { font-size: var(--text-base); font-weight: 500; color: var(--muted); }

  h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--text);
    margin: 28px 0 10px;
  }
  h2::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .col-center h2::before { background: var(--accent); }
  h2.accent::before { background: var(--accent); }
  .section-count {
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--muted);
    background: var(--border);
    padding: 1px 8px;
    border-radius: 999px;
  }
  .card {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 12px;
    transition: opacity 0.15s, box-shadow 0.15s;
  }
  .overflow-date-input {
    width: 100%;
    font-family: inherit;
    font-size: var(--text-base);
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-sm);
    padding: 6px 8px;
  }
  .overflow-date-input:focus { outline: none; border-color: var(--accent); }
  .card.done { background: var(--done-bg); opacity: 0.72; box-shadow: none; }
  .card.list-row { padding: 16px 18px; }
  .checkbox {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }
  .checkbox:disabled { cursor: not-allowed; opacity: 0.35; }
  /* 일괄 선택용 체크박스 — "완료" 체크박스랑 같은 자리에, 같은 모양으로 뜨니까
     지금 누르면 완료 처리되는 건지 선택되는 건지 헷갈리고 무서워진다는 얘기를 들었다.
     네모난 모양 + 테두리로 눈에 띄게 다르게 만들고, 카드 배경도 같이 물들여서
     "이건 완료가 아니라 선택"이라는 게 바로 보이게 한다. */
  .checkbox.task-selection {
    appearance: none; -webkit-appearance: none;
    width: 20px; height: 20px; margin-top: 2px;
    border: 2px solid var(--border); border-radius: 6px;
    background: var(--card); position: relative;
    transition: background 120ms ease, border-color 120ms ease;
  }
  .checkbox.task-selection:checked { background: var(--accent); border-color: var(--accent); }
  .checkbox.task-selection:checked::after {
    content: ''; position: absolute; left: 5px; top: 1px;
    width: 5px; height: 9px; border: solid var(--on-fill); border-width: 0 2px 2px 0; transform: rotate(45deg);
  }
  .card.batch-selected { background: color-mix(in srgb, var(--accent) 8%, var(--card)); border-color: var(--accent); }
  .body { flex: 1; min-width: 0; }
  .top-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .sender { font-weight: 600; font-size: var(--text-md); }
  .desc-editable { cursor: text; border-radius: 4px; }
  .desc-editable:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .desc-edit-input {
    font-family: inherit;
    font-weight: 600;
    font-size: var(--text-md);
    color: var(--text);
    border: none;
    border-bottom: 1px solid var(--accent);
    background: none;
    padding: 0;
    flex: 1;
    min-width: 0;
  }
  .desc-edit-input:focus { outline: none; }
  .meta { color: color-mix(in srgb, var(--muted) 65%, transparent); font-size: var(--text-xs); white-space: nowrap; }
  .summary {
    font-size: var(--text-md);
    line-height: 1.45;
    word-break: break-word;
  }
  .card.done .summary, .card.done .sender, .card.done .desc { text-decoration: line-through; text-decoration-color: var(--muted); }
  .channel {
    display: inline-block;
    font-size: var(--text-xs);
    color: var(--accent);
    margin-top: 6px;
  }
  a.link { color: inherit; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) {
    a.link:hover { text-decoration: underline; }
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .empty { color: var(--muted); font-size: var(--text-md); padding: 12px 0; }

  .badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge {
    font-size: var(--text-xs);
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.priority-high, .badge.priority-critical { color: var(--urgent); border-color: color-mix(in srgb, var(--urgent) 33%, transparent); }
  .badge.due { color: var(--accent); border-color: var(--accent); }
  .badge.overdue { color: var(--urgent); border-color: var(--urgent); background: color-mix(in srgb, var(--urgent) 10%, transparent); font-weight: 600; }
  .badge.overdue::before { content: '⚠ '; }
  .new-dot {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--card);
  }
  .badge.due-today { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); font-weight: 600; }
  .badge.due-today::before { content: '◷ '; }
  .badge.stale { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .badge.priority-critical::before { content: '! '; }
  button.badge { font-family: inherit; cursor: pointer; }
  button.badge:hover { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  select.badge {
    font-family: inherit;
    cursor: pointer;
    -webkit-appearance: none;
    appearance: none;
  }
  select.badge:hover { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  select.badge:focus { outline: none; border-color: var(--accent); }

  .jira-control { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  /* 좁은 사이드바 칼럼(확인 대기중 등)에 들어가면 배지 글자가 알약 모양을 깨고
     단어 중간에서 두 줄로 꺾였다 — 한 줄로 줄이고 넘치면 말줄임표로 처리한다.
     (전화 너비에서는 아래 @media에서 다시 줄바꿈을 허용한다.) */
  .badge.jira-badge, .badge.group-badge {
    display: inline-block; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top;
  }
  .badge.jira-badge {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    font-weight: 600;
  }
  .jira-clear {
    font-size: var(--text-xs);
    color: var(--muted);
    background: none;
    border: none;
    text-decoration: underline;
    cursor: pointer;
    padding: 0;
  }
  .jira-select {
    font-size: var(--text-sm);
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    max-width: calc(100% - 4px);
    box-sizing: border-box;
  }
  .card:has(> .d-more) .jira-control { margin-right: 26px; }
  .badge.group-badge {
    color: var(--text);
    border-color: var(--border);
    background: var(--bg);
    font-weight: 600;
  }
  .group-input {
    font-size: var(--text-sm);
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    max-width: 220px;
  }
  .group-input:focus { outline: none; border-color: var(--accent); }

  .done-details summary {
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--text);
    margin: 28px 0 10px;
    list-style: none;
  }
  .done-details summary::-webkit-details-marker { display: none; }
  .done-details summary::before {
    content: '▸';
    font-size: var(--text-xs);
    color: var(--muted);
    display: inline-block;
    transition: transform 0.15s;
  }
  .done-details[open] summary::before { transform: rotate(90deg); }
  .done-details[open] #doneList {
    opacity: 1;
    transition: opacity 150ms var(--ease-out);
  }
  @starting-style {
    .done-details[open] #doneList { opacity: 0; }
  }
  @media (prefers-reduced-motion: reduce) {
    .done-details[open] #doneList { transition: none; }
  }

  .convert-btn {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    margin-top: 10px;
    margin-right: 8px;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .convert-btn.danger { color: var(--muted); }
  .convert-btn:disabled { color: var(--muted); background: var(--bg); cursor: default; }
  .convert-btn:disabled:hover { background: var(--bg); color: var(--muted); }
  .due-date-input {
    font-family: inherit;
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: none;
    border-radius: 999px;
    padding: 6px 10px;
    margin-top: 10px;
    margin-right: 8px;
    cursor: pointer;
  }
  .due-date-input:focus { outline: none; }

  .quick-add { margin-bottom: 10px; }
  .quick-add input {
    width: 100%;
    font-size: var(--text-base);
    padding: 8px 14px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);
  }
  .quick-add input:focus {
    outline: none;
    border-color: var(--accent);
  }
  /* 일괄 정리 — 선택 모드일 땐 테두리 있는 박스로 감싸서 "지금 특별한 모드"라는 걸 알려주고,
     "모드 자체"(끝내기·몇 개·전체선택)와 "실제로 바꾸는 것"(날짜·그룹)을 두 줄로 나눈다. */
  .task-batch-tools { margin-bottom: 10px; }
  .task-batch-tools.active {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 10px 12px; display: flex; flex-direction: column; gap: 8px;
  }
  .task-batch-mode-row { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; }
  .task-batch-mode-row .wf-section-note { margin: 0 0 0 4px; }
  .task-batch-action-row {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding-top: 8px; border-top: 1px solid var(--border);
  }
  .task-batch-action-row .jira-control { margin: 0; }
  .task-batch-date { display: flex; flex-direction: column; }
  .task-batch-date summary { color: var(--muted); cursor: pointer; font-size: var(--text-sm); font-weight: 600; list-style: none; }
  .task-batch-date summary::-webkit-details-marker { display: none; }
  .task-batch-date[open] summary { color: var(--text); margin-bottom: 6px; }
  .task-batch-date > input, .task-batch-date > button { margin-top: 4px; }
  /* 회의 정리 패널이 아직 쓰는 라벨 칸(업무 상세는 ui.css의 .d-fields로 옮겼다) */
  .detail-field { display: grid; gap: 6px; margin: 12px 0; }
  .detail-field label { color: var(--muted); font-size: var(--text-xs); font-weight: 700; }
  .detail-field input, .detail-field select { width: 100%; font: inherit; color: var(--text); background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px 8px; }
  .task-row { border-radius: var(--radius-sm); box-shadow: none; border-width: 0 0 1px; padding: 8px; margin: 0; gap: 10px; }
  .task-row:hover { background: color-mix(in srgb, var(--accent) 4%, var(--card)); }
  .task-row.is-selected { background: color-mix(in srgb, var(--accent) 9%, var(--card)); box-shadow: inset 3px 0 0 var(--accent); }
  .task-row .body.task-openable { cursor: pointer; border-radius: 6px; }
  .task-row .body.task-openable:focus { outline: 2px solid color-mix(in srgb, var(--accent) 50%, transparent); outline-offset: 2px; }
  .today-group { margin-bottom: 12px; }
  .today-group-header { position: sticky; top: 0; z-index: 1; background: var(--bg); padding: 6px 2px; }

  .wr-view-tabs { display: flex; gap: 4px; margin: 8px 0 10px; }
  .wr-view-btn {
    font-family: inherit;
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 12px;
    cursor: pointer;
  }
  .wr-view-btn.active { border-color: var(--accent); }

  .wr-add-input {
    width: 100%;
    font-size: var(--text-base);
    padding: 8px 10px;
    border-radius: 10px;
    border: 1px dashed var(--border);
    background: var(--bg);
    color: var(--text);
  }
  .wr-add-input:focus { outline: none; border-color: var(--accent); }
  .wr-add-input::placeholder { color: var(--muted); }

  .today-group { margin-bottom: 14px; }
  .today-group:last-child { margin-bottom: 0; }
  .today-done-group { margin-top: 22px; padding-top: 18px; border-top: 1px dashed var(--border); }
  .today-group-header {
    font-size: var(--text-sm);
    font-weight: 700;
    color: var(--accent);
    margin-bottom: 6px;
    padding-left: 2px;
  }
  .today-group-header.misc { color: var(--muted); }

  [hidden] { display: none !important; }
  .grid > *, .wr-layout > * { min-width: 0; }
  .card { padding: 12px 14px; margin-bottom: 8px; gap: 10px; }
  .sender, .badge { overflow-wrap: anywhere; }
  .badge { max-width: 100%; white-space: normal; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .desc-editable:focus-visible { background: var(--bg); }
  .desc-editable:hover::after, .desc-editable:focus-visible::after { content: ' ✎'; color: var(--accent); }
  .group-add { margin: 0 0 10px; }
  .group-add summary { color: var(--muted); cursor: pointer; font-size: var(--text-sm); padding: 4px 0; }
  .group-add input { margin-top: 4px; }
  .notice-dismiss {
    font: inherit; font-size: var(--text-sm); color: var(--muted); background: none; border: none;
    border-radius: 999px; padding: 6px 10px; margin: 0; cursor: pointer; flex-shrink: 0;
    transition: background 120ms ease, color 120ms ease;
  }
  .notice-dismiss:hover { background: var(--bg); color: var(--text); }
  .notice-hint { font-size: var(--text-xs); color: var(--muted); flex-shrink: 0; }
  .sync-note, .report-note { font-size: var(--text-sm); color: var(--muted); margin: 6px 0 12px; overflow-wrap: anywhere; }
  .card[aria-busy="true"] { opacity: .65; pointer-events: none; }
  @media (max-width: 900px) {
    .grid, .grid-2col, .wr-layout { grid-template-columns: minmax(0, 1fr); }
    input, select { max-width: 100%; }
    .quick-add input, .wr-add-input, .desc-edit-input, .group-input { font-size: 16px; }
  }

  /* Product visual direction: calm, flat, task-first workbench. */
  .wr-nav-btn.active { box-shadow: none; }
  .card:not(.task-row) { border-radius: 12px; box-shadow: none; }
  .planning-toggle, .wr-view-btn, .convert-btn { transition: background-color 150ms ease, color 150ms ease, transform 120ms ease; }
  button:active { transform: scale(.98); }
  .sender { letter-spacing: -0.01em; }
  .task-row .meta { font-size: var(--text-xs); color: color-mix(in srgb, var(--muted) 65%, transparent); }
  .task-row .badges { margin-top: 4px; }
  .badge.overdue::before, .badge.due-today::before, .badge.priority-critical::before { content: none; }
  /* 채운 강조 상태: 파랑(행동·선택) / 빨강(삭제). 글자색은 --on-fill이 라이트·다크에서 맞춰 준다. */
  .convert-btn:hover, .wr-view-btn.active { color: var(--on-fill); background: var(--accent); }
  .convert-btn.danger:hover { color: var(--on-fill); background: var(--urgent); }
  .checkbox { width: 22px; height: 22px; }
  @media (pointer: coarse) {
    .checkbox, .checkbox.task-selection { width: 28px; height: 28px; }
    .checkbox.task-selection:checked::after { left: 8px; top: 3px; width: 6px; height: 12px; }
  }
  .quick-add input, .wr-add-input { min-height: 44px; }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

</style>
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/workflows.css">
<link rel="stylesheet" href="/report-ui.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#todayTaskZone">오늘 할 일로 건너뛰기</a>
  <div class="pull-indicator" id="pullIndicator" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>
  <header class="d-hdr">
    <h1 class="d-brand" id="workspaceTitle">워크스페이스</h1>
    <div class="d-datewrap" id="dateBar"></div>
    <nav class="d-tabs" role="tablist" aria-label="화면">
      <button type="button" class="d-tab" id="tabBtnToday" role="tab">오늘</button>
      <button type="button" class="d-tab" id="tabBtnRecords" role="tab">아이디어·결정<span class="d-tabdot" aria-hidden="true"></span></button>
      <button type="button" class="d-tab" id="tabBtnWeekly" role="tab">주간요약</button>
    </nav>
    <button type="button" id="refreshBtn" class="d-iconbtn" aria-label="새로고침" title="새로고침"><svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8a6 6 0 1 1-2-4.47L14 5.2"/><path d="M14 2v3.4h-3.4"/></svg></button>
    <button type="button" id="searchEntryBtn" class="d-srch" aria-label="통합 검색" title="검색">
      <svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M10.2 10.2 14 14"/></svg><span>검색</span><kbd>⌘K</kbd>
    </button>
    <button type="button" id="settingsBtn" class="d-iconbtn d-gear" aria-label="환경설정" title="환경설정"><svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M2 4.6h12M2 11.4h12"/><circle cx="6" cy="4.6" r="1.9"/><circle cx="10.4" cy="11.4" r="1.9"/></svg><i class="d-baddot" aria-hidden="true"></i></button>
  </header>
  <div id="storageBanner" class="d-banner" role="status" hidden></div>
  <div class="page">
    <div class="grid" id="gridToday">
      <aside class="col col-left d-rail" aria-label="오늘 옆줄">
        <div class="d-quiet" id="railSummary">
          <span>결정 검토 <span class="num" id="decisionCount">0</span> · 확인 대기 <span class="num" id="waitingCount">0</span> ·</span>
          <button type="button" class="d-qlink" id="createdTodayBtn" aria-label="오늘 들어온 항목 모아 보기">오늘 신규 <span class="num" id="createdTodayCount">0</span></button>
        </div>

        <section class="d-rsec" id="calendarZone">
          <div class="d-rhd"><span>오늘 미팅</span><span class="n num" id="calendarSectionCount">0</span></div>
          <div id="calendarList"></div>
        </section>

        <section class="d-rsec" id="reminderZone" hidden>
          <div class="d-rhd" id="reminderHeading"><span>리마인드</span><span class="n num" id="reminderSectionCount">0</span></div>
          <div id="reminderList"></div>
        </section>

        <section class="d-rsec d-fu" id="railFollowUps" hidden></section>

        <section class="d-rsec" id="waitingZone">
          <div class="d-rhd" id="waitingHeading"><span>확인 대기</span><span class="n num" id="waitingSectionCount">0</span></div>
          <input type="text" class="d-qa" id="waitingInput" placeholder="확인 대기 추가 — Enter" aria-label="확인 대기 추가" />
          <div id="waitingList"></div>
        </section>
      </aside>

      <main class="col col-center">
        <div id="inboxZone" hidden>
          <div class="d-sechd" id="inboxHeading">새로 들어온 것<span class="n num" id="inboxCount">0</span></div>
          <div class="d-inbox" id="inboxList"></div>
        </div>

        <div id="todayTaskZone" tabindex="-1">
          <div class="d-lhd">
            <h2>오늘 할 일</h2>
            <span class="sub num"><span id="todayTaskCount">0</span> · <span id="todayDoneSummary">완료 0</span></span>
            <span class="sp"></span>
            <div class="d-seg" id="todayViewSeg" role="group" aria-label="오늘 할 일 정렬 방식">
              <button type="button" data-view="project" aria-pressed="true">프로젝트별</button>
              <button type="button" data-view="priority" aria-pressed="false">마감·중요도순</button>
            </div>
            <span id="todayHeadExtra"></span>
            <div class="task-batch-tools" id="taskBatchTools"></div>
            <button type="button" class="d-btn" id="laterTaskToggle" aria-expanded="false" aria-controls="laterTaskDrawer">나중에 할 일 <span class="num" id="laterTaskSectionCount">0</span></button>
          </div>
          <div id="suggestZone" hidden></div>
          <div class="task-content-layout">
            <div class="d-list" id="todayListSurface">
              <div class="d-qaf">
                <svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>
                <input type="text" id="todayTaskInput" placeholder="오늘 할 일 추가 — Enter" aria-label="오늘 할 일 추가" />
              </div>
              <div id="todayTaskList"></div>
            </div>
            <aside id="taskDetailPanel" class="d-side" hidden aria-label="선택한 항목 상세"></aside>
          </div>
        </div>
      </main>
    </div>

    <div class="grid grid-2col" id="gridRecords" hidden>
      <aside class="col col-narrow">
        <details class="done-details" open>
          <summary>언젠가<span class="section-count" id="ideaCount">0</span></summary>
          <div class="quick-add">
            <input type="text" id="ideaInput" placeholder="언젠가 메모 추가…" aria-label="언젠가 할 일 메모 추가" />
          </div>
          <div id="ideaList"></div>
        </details>
      </aside>

      <main class="col col-wide">
        <details class="done-details" open>
          <summary>정책/얼라인<span class="section-count" id="decisionSectionCount">0</span></summary>
          <div class="quick-add">
            <input type="text" id="decisionInput" placeholder="정해진 내용 추가…" aria-label="정책/얼라인 추가" />
          </div>
          <div id="decisionList"></div>
        </details>
        <details class="done-details" id="decisionArchiveZone">
          <summary>반영 완료<span class="section-count" id="decisionArchiveCount">0</span></summary>
          <div class="quick-add">
            <input type="search" id="decisionArchiveSearch" placeholder="지난 결정 검색 (내용, 그룹, 지라)" aria-label="반영 완료한 결정 검색" autocomplete="off" />
          </div>
          <div id="decisionArchiveList"></div>
        </details>
      </main>
    </div>

    <div class="wr-layout" id="gridWeekly" hidden>
      <aside class="wr-sidebar">
        <h2>주간 요약<span class="section-count" id="weeklyReportCount">0</span></h2>
        <div id="weeklyReportNav"></div>
      </aside>
      <main class="wr-detail" id="weeklyReportDetail"></main>
    </div>
  </div>

  <!-- 나중에 할 일 서랍 — 헤더 아래 오른쪽에 붙어서 열리고, 넓은 화면에서는 본문을 덮지 않고 밀어낸다 -->
  <aside class="d-drawer" id="laterTaskDrawer" aria-label="나중에 할 일" aria-hidden="true">
    <div class="d-dhd">
      <h2>나중에 할 일</h2>
      <span class="n num" id="laterDrawerCount">0</span>
      <button type="button" class="d-iconbtn" id="laterTaskClose" aria-label="나중에 할 일 닫기"><svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="d-dbody">
      <input type="text" class="d-qa" id="laterTaskInput" placeholder="나중에 할 일 추가 — Enter" aria-label="나중에 할 일 추가" />
      <div id="laterTaskList"></div>
    </div>
  </aside>

  <div id="liveRegion" class="d-toast" role="status" aria-live="polite" hidden></div>

  <dialog id="settingsDialog" class="settings-dialog" aria-label="환경설정">
    <div class="settings-head">
      <h2>환경설정</h2>
      <button type="button" id="settingsCloseBtn" class="notice-dismiss" aria-label="닫기">닫기</button>
    </div>
    <div class="wr-view-tabs">
      <button type="button" class="wr-view-btn active" data-settings-tab="status">상태</button>
      <button type="button" class="wr-view-btn" data-settings-tab="guide">사용법</button>
    </div>
    <div id="settingsStatusView"></div>
    <div id="settingsGuideView" hidden></div>
  </dialog>

<script src="/workflows.js"></script>
<script src="/report-ui.js"></script>
<script src="/app.js"></script>
</body>
</html>
