<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#f7f7f8" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#16161a" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="워크스페이스" />
<title>워크스페이스</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e5ea;
    --text: #18181b;
    --muted: #52525b;
    --accent: #2563eb;
    --urgent: #c93636;
    --warn: #a86100;
    --success: #237a4b;
    --done-bg: #f1f5f9;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
    --radius: 12px;
    --shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #111318;
      --card: #1b1f27;
      --border: #303640;
      --text: #f3f4f6;
      --muted: #aaaab2;
      --accent: #7aa2ff;
      --urgent: #ff9292;
      --warn: #ffc46b;
      --success: #74d69a;
      --done-bg: #171a20;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.28);
    }
  }
  * { box-sizing: border-box; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    line-height: 1.5;
  }
  .page { max-width: 1240px; margin: 0 auto; padding: 24px 16px 48px; }
  .page-header { display: flex; align-items: flex-start; justify-content: space-between; gap: 8px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .settings-btn {
    width: 30px; height: 30px; line-height: 1; font-size: 15px;
    color: color-mix(in srgb, var(--muted) 60%, transparent);
    background: none; border: none; border-radius: 50%; cursor: pointer;
    flex-shrink: 0; transition: color 120ms ease, background 120ms ease;
  }
  .settings-btn:hover { color: var(--text); background: var(--card); }

  .settings-dialog {
    width: min(560px, calc(100vw - 32px)); max-height: 82dvh; box-sizing: border-box;
    padding: 24px; border: 1px solid var(--border); border-radius: 16px;
    background: var(--bg); color: var(--text);
  }
  .settings-dialog::backdrop { background: #10182866; }
  .settings-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .settings-head h2 { font-size: 18px; margin: 0; }
  .settings-dialog .wr-view-tabs { margin-bottom: 14px; }

  .automation-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; }
  .automation-card-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 4px; }
  .automation-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .automation-card.has-failure .automation-dot { background: var(--urgent); }
  .automation-name { font-weight: 700; font-size: 13px; }
  .automation-time { font-size: 11px; color: var(--muted); margin-left: auto; }
  .automation-summary { font-size: 12px; color: var(--muted); line-height: 1.5; }
  .automation-failures { margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }
  .automation-failure-row { font-size: 11px; color: var(--urgent); line-height: 1.6; }
  .automation-log-toggle { margin-top: 8px; }
  .automation-log-toggle summary { color: var(--muted); cursor: pointer; font-size: 11px; font-weight: 600; }
  .automation-log-tail { margin: 8px 0 0; padding: 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-family: ui-monospace, monospace; font-size: 10px; line-height: 1.6; color: var(--muted); white-space: pre-wrap; word-break: break-all; max-height: 240px; overflow-y: auto; }

  .settings-guide dt { font-weight: 700; font-size: 13px; margin: 16px 0 4px; }
  .settings-guide dt:first-child { margin-top: 0; }
  .settings-guide dd { margin: 0; font-size: 12px; color: var(--muted); line-height: 1.6; }
  @media (max-width: 600px) { .settings-dialog { padding: 16px; } }
  .date-bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 20px; }
  .date-bar-info { display: inline-flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .refresh-btn {
    width: 26px;
    height: 26px;
    line-height: 1;
    font-size: 15px;
    color: color-mix(in srgb, var(--muted) 60%, transparent);
    background: none;
    border: none;
    border-radius: 50%;
    cursor: pointer;
    transition: color 120ms ease, transform 400ms var(--ease-out);
  }
  .refresh-btn:hover { color: var(--text); background: var(--bg); }
  .refresh-btn.spinning { transform: rotate(360deg); color: var(--accent); }

  /* 당겨서 새로고침 — 화면 맨 위에서 아래로 끌면 나타난다 */
  body { overscroll-behavior-y: contain; }
  .pull-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    z-index: 60;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 15px;
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-40px);
  }
  .pull-indicator.snapping { transition: transform 260ms var(--ease-out), opacity 260ms var(--ease-out); }
  .pull-indicator.ready { color: var(--accent); border-color: var(--accent); }
  .pull-indicator.refreshing { color: var(--accent); animation: pull-spin 700ms linear infinite; }
  @keyframes pull-spin { to { transform: translateY(var(--pull-y, 56px)) rotate(360deg); } }
  .date-chip {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 13px;
    font-weight: 600;
    padding: 6px 14px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--accent) 12%, transparent);
    color: var(--accent);
  }
  .date-chip .dow {
    font-weight: 500;
    opacity: 0.75;
  }
  .date-chip.muted {
    background: var(--border);
    color: var(--muted);
    font-weight: 500;
  }
  .date-chip.stale {
    background: color-mix(in srgb, var(--warn) 15%, transparent);
    color: var(--warn);
  }
  .sync-chip {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    margin-left: 8px;
    font-size: 11px;
    font-weight: 600;
    padding: 5px 11px;
    border-radius: 999px;
    background: color-mix(in srgb, var(--warn) 12%, transparent);
    color: var(--warn);
    cursor: help;
  }
  .sync-chip::before {
    content: '';
    width: 5px;
    height: 5px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }

  .tab-bar {
    display: flex;
    gap: 4px;
    margin-bottom: 20px;
    border-bottom: 1px solid var(--border);
  }
  .tab-btn {
    position: relative;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--muted);
    background: none;
    border: none;
    padding: 8px 4px 10px;
    margin-right: 16px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: color 120ms ease, border-color 120ms ease;
  }
  .tab-btn:hover { color: var(--text); }
  .tab-btn.active { color: var(--text); border-bottom-color: var(--accent); }
  .tab-dot {
    display: none;
    position: absolute;
    top: 4px;
    right: -6px;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
  }
  .tab-btn.has-new .tab-dot { display: block; }

  .grid {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 300px;
    gap: 20px;
    align-items: start;
  }
  .grid[hidden] { display: none; }
  #gridToday:not(.planning-mode) { grid-template-columns: 260px minmax(0, 1fr); }
  #gridToday:not(.planning-mode) #laterTaskZone { display: none; }
  #gridToday.planning-mode { grid-template-columns: 260px minmax(0, 1fr) 300px; }
  .planning-toggle {
    margin-left: auto;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: 0;
    border-radius: 999px;
    padding: 6px 11px;
    cursor: pointer;
  }
  .planning-toggle:hover, .planning-toggle[aria-pressed="true"] { color: #fff; background: var(--accent); }
  .col-left, .col-right { min-width: 0; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  .grid-2col { grid-template-columns: 320px minmax(0, 1fr); }
  .col-narrow, .col-wide { min-width: 0; }
  #decisionArchiveZone { margin-top: 16px; }

  .wr-layout {
    display: grid;
    grid-template-columns: 220px minmax(0, 1fr);
    gap: 24px;
    align-items: start;
  }
  .wr-layout[hidden] { display: none; }
  @media (max-width: 900px) {
    .wr-layout { grid-template-columns: 1fr; }
  }
  .wr-sidebar { min-width: 0; }
  .wr-detail { min-width: 0; }
  #weeklyReportNav { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .wr-nav-btn {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    font-family: inherit;
    color: var(--muted);
    background: none;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    cursor: pointer;
  }
  .wr-nav-btn:hover { background: var(--card); }
  .wr-nav-btn.active { color: var(--text); background: var(--card); box-shadow: var(--shadow); }
  .wr-nav-week { font-size: 13px; font-weight: 700; }
  .wr-nav-range { font-size: 11px; font-weight: 500; color: var(--muted); }
  .wr-nav-btn.active .wr-nav-range { color: var(--muted); }
  .wr-detail-heading { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; margin-bottom: 4px; }
  .wr-detail-week { font-size: 18px; font-weight: 700; }
  .wr-detail-range { font-size: 13px; font-weight: 500; color: var(--muted); }
  /* 신문 단(段) 방식(columns)이 아니라 실제 그리드다 — 섹션 순서(완료한 일 → 진행중 →
     다음 주 계획 → 새로 정해진 것 → 확인 대기)가 높이에 따라 뒤섞이지 않게 자리를 고정해둔다. */
  .wr-sections-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-areas:
      "done doing"
      "later later"
      "decisions waiting";
    column-gap: 20px;
    row-gap: 20px;
  }
  .wr-sections-grid .wr-section { margin-bottom: 0; min-width: 0; }
  .wr-sections-grid .wr-section[data-section-key="done"] { grid-area: done; }
  .wr-sections-grid .wr-section[data-section-key="doing"] { grid-area: doing; }
  .wr-sections-grid .wr-section[data-section-key="later"] { grid-area: later; }
  .wr-sections-grid .wr-section[data-section-key="decisions"] { grid-area: decisions; }
  .wr-sections-grid .wr-section[data-section-key="waiting"] { grid-area: waiting; }
  @media (max-width: 700px) {
    .wr-sections-grid {
      grid-template-columns: 1fr;
      grid-template-areas: "done" "doing" "later" "decisions" "waiting";
    }
  }

  .stats { display: flex; gap: 12px; margin-bottom: 12px; flex-wrap: wrap; }
  .stat {
    flex: 1;
    min-width: 110px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 14px 16px;
  }
  .stat-num { display: block; font-size: 22px; font-weight: 700; line-height: 1.25; }
  .stat-label { font-size: 12px; color: var(--muted); }
  .stat.urgent .stat-num { color: var(--urgent); }
  .stat.urgent.zero .stat-num { color: var(--text); }

  h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 14px;
    font-weight: 700;
    color: var(--text);
    margin: 28px 0 10px;
  }
  h2::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .col-center h2::before { background: var(--accent); }
  h2.accent::before { background: var(--accent); }
  #reminderZone.urgent h2::before { background: var(--urgent); }
  #reminderZone.warn h2::before { background: var(--warn); }
  #waitingZone h2::before { background: var(--warn); }
  .section-count {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    background: var(--border);
    padding: 1px 7px;
    border-radius: 999px;
  }
  .card {
    position: relative;
    display: flex;
    gap: 14px;
    align-items: flex-start;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px 20px;
    margin-bottom: 12px;
    transition: opacity 0.15s, box-shadow 0.15s;
  }
  .card:has(.overflow-menu) { padding-right: 44px; }

  .overflow-menu { position: absolute; top: 10px; right: 10px; }
  .overflow-btn {
    width: 26px;
    height: 26px;
    line-height: 1;
    font-size: 14px;
    font-weight: 600;
    color: color-mix(in srgb, var(--muted) 55%, transparent);
    background: none;
    border: none;
    border-radius: 50%;
    cursor: pointer;
  }
  .overflow-btn:hover { background: var(--bg); color: var(--text); }
  .overflow-list {
    position: absolute;
    top: 30px;
    right: 0;
    z-index: 10;
    min-width: 210px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    box-shadow: var(--shadow);
    padding: 6px;
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .overflow-list[hidden] { display: none; }
  .overflow-item {
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    font-weight: 500;
    color: var(--text);
    background: none;
    border: none;
    border-radius: 8px;
    padding: 7px 10px;
    cursor: pointer;
  }
  .overflow-item:hover { background: var(--bg); }
  .overflow-item:disabled { color: var(--muted); cursor: default; }
  .overflow-item:disabled:hover { background: none; }
  .overflow-item.danger { color: var(--urgent); }
  .overflow-date-wrap, .overflow-field { padding: 6px 10px 4px; }
  .overflow-date-label, .overflow-field-label { font-size: 11px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
  .overflow-sep { height: 1px; background: var(--border); margin: 6px 4px; }
  .overflow-field .jira-control, .overflow-field .priority-control { margin: 0; }
  .overflow-field .jira-select, .overflow-field select, .overflow-field input { width: 100%; box-sizing: border-box; max-width: none; }
  .overflow-field .badge {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .overflow-date-input {
    width: 100%;
    font-family: inherit;
    font-size: 13px;
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 8px;
  }
  .overflow-date-input:focus { outline: none; border-color: var(--accent); }
  .card.done { background: var(--done-bg); opacity: 0.72; box-shadow: none; }
  #waitingList .card { border-radius: 10px; box-shadow: none; padding: 10px 12px; margin-bottom: 6px; }
  #waitingList .card .badges { margin-top: 4px; }
  .card.list-row { padding: 16px 18px; }
  .checkbox {
    width: 20px;
    height: 20px;
    margin-top: 2px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }
  .checkbox:disabled { cursor: not-allowed; opacity: 0.35; }
  .body { flex: 1; min-width: 0; }
  .top-row {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 4px;
    flex-wrap: wrap;
  }
  .sender { font-weight: 600; font-size: 14px; }
  .desc-editable { cursor: text; border-radius: 4px; }
  .desc-editable:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
  .desc-edit-input {
    font-family: inherit;
    font-weight: 600;
    font-size: 14px;
    color: var(--text);
    border: none;
    border-bottom: 1px solid var(--accent);
    background: none;
    padding: 0;
    flex: 1;
    min-width: 0;
  }
  .desc-edit-input:focus { outline: none; }
  .meta { color: color-mix(in srgb, var(--muted) 65%, transparent); font-size: 11px; white-space: nowrap; }
  .summary {
    font-size: 14px;
    line-height: 1.45;
    word-break: break-word;
  }
  .card.done .summary, .card.done .sender, .card.done .desc { text-decoration: line-through; text-decoration-color: var(--muted); }
  .channel {
    display: inline-block;
    font-size: 11px;
    color: var(--accent);
    margin-top: 6px;
  }
  a.link { color: inherit; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) {
    a.link:hover { text-decoration: underline; }
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .empty { color: var(--muted); font-size: 14px; padding: 12px 0; }

  .badges { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .badge {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .badge.priority-high, .badge.priority-critical { color: var(--urgent); border-color: color-mix(in srgb, var(--urgent) 33%, transparent); }
  .badge.due { color: var(--accent); border-color: var(--accent); }
  .badge.overdue { color: var(--urgent); border-color: var(--urgent); background: color-mix(in srgb, var(--urgent) 10%, transparent); font-weight: 600; }
  .badge.overdue::before { content: '⚠ '; }
  .new-dot {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--card);
  }
  .badge.due-today { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); font-weight: 600; }
  .badge.due-today::before { content: '◷ '; }
  .badge.stale { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 50%, transparent); }
  .badge.due-tomorrow { color: var(--warn); border-color: var(--warn); background: color-mix(in srgb, var(--warn) 10%, transparent); }
  .badge.priority-critical::before { content: '! '; }
  .badge.doing { color: var(--accent); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 10%, transparent); font-weight: 600; }
  .card-eyebrow {
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 3px;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #inboxZone { margin-bottom: 14px; }
  #inboxZone[hidden] { display: none; }
  #inboxZone h2::before { background: var(--warn); }
  .inbox-card {
    border-left: 3px solid var(--warn);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .inbox-card .body { flex: 1; min-width: 180px; }
  .inbox-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .inbox-btn {
    font: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    cursor: pointer;
    white-space: nowrap;
    transition: background-color 120ms ease, color 120ms ease;
  }
  .inbox-btn:hover { color: #fff; background: var(--accent); }
  .inbox-btn.quiet { color: var(--muted); background: none; }
  .inbox-btn.quiet:hover { color: var(--success); background: color-mix(in srgb, var(--success) 12%, transparent); }
  .inbox-btn.danger { color: var(--muted); background: none; }
  .inbox-btn.danger:hover { color: #fff; background: var(--urgent); }
  .inbox-actions { border-left: 1px solid var(--border); padding-left: 10px; }

  .today-doing-group .today-group-header { color: var(--accent); }
  .today-doing-group .card { border-left: 3px solid var(--accent); }
  .badge.who-badge { cursor: pointer; }

  /* 그리드 두 칸을 모두 가로질러야 하는 요소들 — columns 방식일 때 쓰던 column-span 대신 grid-column을 쓴다 */
  /* 선택해서 한 번에 옮기는 건 가끔 쓰는 보조 기능이다 — 본문처럼 크게 적지 않고

     여기 flex 줄에서는 버튼만 라벨보다 아래로 처지게 만든다 — 이 안에서만 지운다.
     또한 버튼은 터치 영역 확보용 min-height(36px)가 있는데, <button>은 그 남는 공간을

<script src="/workflows.js"></script>
<script>
let jiraIssuesCache = [];
let customGroupsCache = [];
let reportRefsCache = {};
let appVersion = null;

// 화면을 다시 그리면 쓰던 입력이 날아가므로, 자동 갱신은 입력 중이면 건너뛴다
function isTyping() {
  const el = document.activeElement;
  return !!(el && (el.matches('input, textarea, select') || el.isContentEditable));
}
let openTasksCache = [];
let planningMode = false;
let todaySort = 'project';
let selectedTaskId = null;
let selectedTaskMode = 'today';
let noticeTimer;
let lastRemovedId = null;

function showNotice(message, error = false, retry = null, action = null) {
  const region = document.getElementById('liveRegion');
  clearTimeout(noticeTimer);
  region.hidden = false;
  region.classList.toggle('error', error);
  region.textContent = message;
  if (!error && !undoReplaying && Date.now() - lastUndoRecordedAt < 3000) {
    const hint = document.createElement('span');
    hint.className = 'notice-hint';
    hint.textContent = typeof navigator !== 'undefined' && /Mac/.test(navigator.platform) ? '⌘Z로 되돌리기' : 'Ctrl+Z로 되돌리기';
    region.appendChild(hint);
  }
  if (lastRemovedId && !error) {
    const undo = document.createElement('button');
    undo.type = 'button';
    undo.className = 'convert-btn';
    undo.textContent = '삭제 실행 취소';
    undo.addEventListener('click', async () => {
      const id = lastRemovedId;
      undo.disabled = true;
      try {
        await request('/api/track/restore', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ id }) });
        lastRemovedId = null;
        await load();
        announce('삭제한 항목을 복원했습니다.');
      } catch { undo.disabled = false; }
    });
    region.appendChild(undo);
  }
  if (retry) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'convert-btn';
    button.textContent = '다시 시도';
    button.addEventListener('click', retry);
    region.appendChild(button);
  }
  if (action) {
    const button = document.createElement('button');
    button.type = 'button';
    button.className = 'convert-btn';
    button.textContent = action.label;
    button.addEventListener('click', () => action.onClick(button));
    region.appendChild(button);
  }
  const dismiss = document.createElement('button');
  dismiss.type = 'button';
  dismiss.className = 'notice-dismiss';
  dismiss.textContent = '닫기';
  dismiss.addEventListener('click', () => { region.hidden = true; });
  region.appendChild(dismiss);
  if (!error && !lastRemovedId) noticeTimer = setTimeout(() => { region.hidden = true; }, action ? 8000 : 4500);
}

async function request(url, options) {
  const writing = options?.method === 'POST';
  if (writing) showNotice('저장 중…');
  const controller = new AbortController();
  const timeout = setTimeout(() => controller.abort(), 15000);
  try {
    const response = await fetch(url, { ...options, signal: controller.signal });
    if (!response.ok) throw new Error(`요청 실패 (${response.status})`);
    const data = await response.clone().json();
    if (data.ok === false) throw new Error(data.error || '저장하지 못했습니다.');
    if (writing) recordUndoFor(url, JSON.parse(options.body || '{}'));
    if (url === '/api/track/remove' && !undoReplaying) lastRemovedId = JSON.parse(options.body).id;
    if (writing) showNotice('저장했습니다.');
    return response;
  } catch (error) {
    error.reported = true;
    showNotice(writing ? '저장을 확인하지 못했습니다. 입력은 유지됩니다. 연결을 확인한 뒤 다시 시도해 주세요.' : '목록을 불러오지 못했습니다.', true, writing ? null : () => load());
    throw error;
  } finally {
    clearTimeout(timeout);
  }
}

// Event handlers keep their inputs in place on failure; request() displays the error.
window.addEventListener('unhandledrejection', event => {
  if (event.reason?.reported) event.preventDefault();
});

const undoStack = [];
const redoStack = [];
let undoReplaying = false;
let lastUndoRecordedAt = 0;
let itemsById = new Map();

const postJson = (url, body) => request(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });

function pushUndo(entry) {
  if (undoReplaying) return;
  undoStack.push(entry);
  if (undoStack.length > 30) undoStack.shift();
  redoStack.length = 0;
  lastUndoRecordedAt = Date.now();
}

// Reads itemsById before load() refreshes it, so the "before" state is still available.
function recordUndoFor(url, body) {
  if (url === '/api/track/restore' && body.id === lastRemovedId) lastRemovedId = null;
  if (undoReplaying) return;
  const item = itemsById.get(body.id);
  const label = item ? item.description : '';
  if (url === '/api/track/toggle') {
    pushUndo({ label, undo: () => postJson(url, { id: body.id }), redo: () => postJson(url, { id: body.id }) });
  } else if (url === '/api/track/set-scheduled' && item) {
    const before = item.scheduled || null;
    pushUndo({ label, undo: () => postJson(url, { id: body.id, scheduled: before }), redo: () => postJson(url, { id: body.id, scheduled: body.scheduled }) });
  } else if (url === '/api/track/remove') {
    pushUndo({ label, removedId: body.id, undo: () => postJson('/api/track/restore', { id: body.id }), redo: () => postJson(url, { id: body.id }) });
  } else if (url === '/api/track/restore') {
    // Restored from the notice's own undo button — drop the matching entry so ⌘Z doesn't restore twice.
    const index = undoStack.findLastIndex(entry => entry.removedId === body.id);
    if (index >= 0) undoStack.splice(index, 1);
  }
}

async function replayUndo(direction) {
  if (undoReplaying) return;
  const [from, to] = direction === 'undo' ? [undoStack, redoStack] : [redoStack, undoStack];
  const entry = from.pop();
  if (!entry) {
    showNotice(direction === 'undo' ? '되돌릴 작업이 없습니다.' : '다시 실행할 작업이 없습니다.');
    return;
  }
  undoReplaying = true;
  try {
    await entry[direction]();
    to.push(entry);
    await load();
    showNotice(`${direction === 'undo' ? '되돌림' : '다시 실행'}${entry.label ? `: ${entry.label}` : ''}`);
  } catch {
    from.push(entry);
  } finally {
    undoReplaying = false;
  }
}

document.addEventListener('keydown', (event) => {
  if (!(event.metaKey || event.ctrlKey) || event.altKey || event.key.toLowerCase() !== 'z') return;
  if (event.target?.closest?.('input, textarea, select, [contenteditable="true"], [contenteditable=""]')) return;
  event.preventDefault();
  replayUndo(event.shiftKey ? 'redo' : 'undo');
});

async function load() {
  let res;
  try { res = await request('/api/items'); } catch { return; }
  const data = await res.json();
  itemsById = new Map(['todayTasks', 'laterTasks', 'waiting', 'decisions', 'decisionArchive', 'ideas']
    .flatMap(key => data[key] || []).map(item => [item.id, item]));
  // 앱 화면이 바뀌었으면 데이터만 다시 받아선 소용없다 (새 UI가 아예 없는 상태).
  // 입력 중이 아닐 때만 스스로 새로고침한다.
  if (data.appVersion) {
    if (!appVersion) appVersion = data.appVersion;
    else if (appVersion !== data.appVersion && !isTyping()) {
      location.reload();
      return;
    }
  }

  jiraIssuesCache = data.jiraIssues || [];
  customGroupsCache = data.customGroups || [];
  reportRefsCache = data.reportRefs || {};
  openTasksCache = [...(data.todayTasks || []), ...(data.laterTasks || [])].filter(t => t.status !== 'done');
  workflowRender(data);
  renderDateBar(data);
  renderCalendar(data.calendar);
  renderSuggestions(data.suggestions);
  renderInbox(data.inboxTasks || []);
  renderLaterTasks(data.laterTasks || []);
  renderWaiting(data.waiting || []);
  renderTodayTasks(data.todayTasks || []);
  renderIdeas(data.ideas || []);
  renderDecisions(data.decisions || []);
  decisionArchiveCache = data.decisionArchive || [];
  renderDecisionArchive();
  const hasNewRecord = [...(data.ideas || []), ...(data.decisions || [])].some(i => i.isNew);
  document.getElementById('tabBtnRecords').classList.toggle('has-new', hasNewRecord);
  renderWeeklyReports(data.weeklyReports || []);
  document.getElementById('createdTodayCount').textContent = data.createdToday || 0;

  const todayIds = new Set((data.todayTasks || []).map(t => t.id));
  const reminders = [...(data.todayTasks || []), ...(data.laterTasks || [])]
    .filter(t => !todayIds.has(t.id) && t.status !== 'done' && t.due && diffDays(t.due) <= 1 && (t.priority === 'high' || t.priority === 'critical'))
    .sort((a, b) => diffDays(a.due) - diffDays(b.due));
  renderReminders(reminders);
  syncTaskDetail([...data.todayTasks || [], ...data.laterTasks || []]);
  renderPlanningMode();
}

function renderPlanningMode() {
  const grid = document.getElementById('gridToday');
  const button = document.getElementById('planningToggle');
  if (!grid || !button) return;
  grid.classList.toggle('planning-mode', planningMode);
  button.setAttribute('aria-pressed', String(planningMode));
  button.textContent = planningMode ? '완료' : '계획·정리';
  button.setAttribute('aria-label', planningMode ? '계획·정리 모드 닫기' : '계획·정리 모드 열기');
  const laterZone = document.getElementById('laterTaskZone');
  if (laterZone && planningMode) laterZone.open = true;
}

function renderDateBar(data) {
  if (data.title) {
    document.getElementById('workspaceTitle').textContent = data.title;
    document.title = data.title;
  }
  const bar = document.getElementById('dateBar');
  bar.innerHTML = `<span class="date-chip">${formatKoreanDate(data.today)}</span>`;

  // 자동 갱신이 실패해도 화면엔 낡은 자료가 그대로 보이므로, 낡았을 때만 알린다
  // used === false 는 "이 회사에선 안 쓰는 도구" — 경고할 일이 아니다
  const stale = [];
  const slack = data.slackSync || {};
  if (slack.used !== false && slack.stale) stale.push({ name: '슬랙 캡처', lastSync: slack.lastSync });
  const cal = data.calendar || {};
  if (cal.used !== false && (cal.stale || !cal.lastSync)) stale.push({ name: '캘린더', lastSync: cal.lastSync });
  const jira = data.jiraSync || {};
  if (jira.used !== false && jira.stale) stale.push({ name: '지라', lastSync: jira.lastSync });

  stale.forEach(source => {
    const chip = document.createElement('span');
    chip.className = 'sync-chip';
    const days = source.lastSync ? -diffDays(source.lastSync) : null;
    const age = days === null ? '동기화 안 됨' : days === 1 ? '어제 기준' : `${days}일 전 기준`;
    chip.textContent = `${source.name} ${age}`;
    chip.title = source.lastSync
      ? `${source.name} 자동 갱신이 ${source.lastSync} 이후 멈춰 있습니다. 목록이 최신이 아닐 수 있어요.`
      : `${source.name}를 아직 한 번도 가져오지 못했습니다.`;
    bar.appendChild(chip);
  });
}

function suggestDismissedToday() {
  try { return localStorage.getItem('suggestDismissed') === todayStr(); } catch { return false; }
}

    return !blocked || blocked.status === 'done';
  });

    list.appendChild(row);
