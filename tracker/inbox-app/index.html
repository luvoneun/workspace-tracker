<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#1e222a" media="(prefers-color-scheme: dark)" />
<link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-32.png" />
<link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-180.png" />
<link rel="manifest" href="/manifest.webmanifest" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-title" content="워크스페이스" />
<title>워크스페이스</title>
<style>
  /* 토큰·리셋·헤더·탭·배너·알림 등 공용 부품은 /ui.css에 있다.
     아래는 아직 새 모양으로 바꾸지 않은 화면의 옛 규칙이다(배치마다 구역별로 사라진다). */
  /* 당겨서 새로고침 — 화면 맨 위에서 아래로 끌면 나타난다 */
  .pull-indicator {
    position: fixed;
    top: 0;
    left: 50%;
    z-index: 60;
    width: 32px;
    height: 32px;
    margin-left: -16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: var(--text-lg);
    color: var(--muted);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 50%;
    box-shadow: var(--shadow);
    opacity: 0;
    pointer-events: none;
    transform: translateY(-40px);
  }
  .pull-indicator.snapping { transition: transform 260ms var(--ease-out), opacity 260ms var(--ease-out); }
  .pull-indicator.ready { color: var(--accent); border-color: var(--accent); }
  .pull-indicator.refreshing { color: var(--accent); animation: pull-spin 700ms linear infinite; }
  @keyframes pull-spin { to { transform: translateY(var(--pull-y, 56px)) rotate(360deg); } }

  .grid {
    display: grid;
    grid-template-columns: 260px minmax(0, 1fr) 300px;
    gap: 20px;
    align-items: start;
  }
  .grid[hidden] { display: none; }
  .col-left { min-width: 0; }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }

  h2 {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: var(--text-md);
    font-weight: 700;
    color: var(--text);
    margin: 28px 0 10px;
  }
  h2::before {
    content: '';
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--muted);
    flex-shrink: 0;
  }
  .col-center h2::before { background: var(--accent); }
  h2.accent::before { background: var(--accent); }
  .section-count {
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--muted);
    background: var(--border);
    padding: 1px 8px;
    border-radius: 999px;
  }
  .desc-editable { cursor: text; border-radius: 4px; }
  .desc-editable:hover { background: var(--hover); }
  .desc-edit-input {
    font-family: inherit;
    font-weight: 600;
    font-size: var(--text-md);
    color: var(--text);
    border: none;
    border-bottom: 1px solid var(--accent);
    background: none;
    padding: 0;
    flex: 1;
    min-width: 0;
  }
  .desc-edit-input:focus { outline: none; }
  a.link { color: inherit; text-decoration: none; }
  @media (hover: hover) and (pointer: fine) {
    a.link:hover { text-decoration: underline; }
  }
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
  .empty { color: var(--muted); font-size: var(--text-md); padding: 12px 0; }

  .badge {
    font-size: var(--text-xs);
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--bg);
    border: 1px solid var(--border);
    color: var(--muted);
  }
  .new-dot {
    position: absolute;
    top: -4px;
    right: -4px;
    width: 11px;
    height: 11px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 2px var(--card);
  }

  .jira-control { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  /* 좁은 사이드바 칼럼(확인 대기중 등)에 들어가면 배지 글자가 알약 모양을 깨고
     단어 중간에서 두 줄로 꺾였다 — 한 줄로 줄이고 넘치면 말줄임표로 처리한다.
     (전화 너비에서는 아래 @media에서 다시 줄바꿈을 허용한다.) */
  button.badge { font-family: inherit; cursor: pointer; }
  button.badge:hover { background: color-mix(in srgb, var(--accent) 10%, var(--bg)); }
  .badge.jira-badge, .badge.group-badge {
    display: inline-block; max-width: 100%;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; vertical-align: top;
  }
  .badge.jira-badge {
    color: var(--accent);
    border-color: color-mix(in srgb, var(--accent) 30%, transparent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    font-weight: 600;
  }
  .jira-select {
    font-size: var(--text-sm);
    color: var(--muted);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    max-width: calc(100% - 4px);
    box-sizing: border-box;
  }
  .badge.group-badge {
    color: var(--text);
    border-color: var(--border);
    background: var(--bg);
    font-weight: 600;
  }
  .group-input {
    font-size: var(--text-sm);
    color: var(--text);
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 4px 10px;
    max-width: 220px;
  }
  .group-input:focus { outline: none; border-color: var(--accent); }
  .convert-btn {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 10%, transparent);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    margin-top: 10px;
    margin-right: 8px;
    cursor: pointer;
    transition: background 120ms ease, color 120ms ease;
  }
  .convert-btn.danger { color: var(--muted); }
  .convert-btn:disabled { color: var(--muted); background: var(--bg); cursor: default; }
  .convert-btn:disabled:hover { background: var(--bg); color: var(--muted); }
  [hidden] { display: none !important; }
  .grid > * { min-width: 0; }
  .badge { max-width: 100%; overflow-wrap: anywhere; white-space: normal; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
  .desc-editable:focus-visible { background: var(--bg); }
  .desc-editable:hover::after, .desc-editable:focus-visible::after { content: ' ✎'; color: var(--accent); }
  @media (max-width: 900px) {
    .grid { grid-template-columns: minmax(0, 1fr); }
    input, select { max-width: 100%; }
    .desc-edit-input, .group-input { font-size: 16px; }
  }

  /* Product visual direction: calm, flat, task-first workbench. */
  .convert-btn { transition: background-color 150ms ease, color 150ms ease, transform 120ms ease; }
  button:active { transform: scale(.98); }
  /* 채운 강조 상태: 파랑(행동·선택) / 빨강(삭제). 글자색은 --on-fill이 라이트·다크에서 맞춰 준다. */
  .convert-btn:hover { color: var(--on-fill); background: var(--accent); }
  .convert-btn.danger:hover { color: var(--on-fill); background: var(--urgent); }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; }
  }

</style>
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/workflows.css">
<link rel="stylesheet" href="/report-ui.css">
</head>
<body>
  <a class="skip-link" id="skipLink" href="#todayTaskZone">오늘 할 일로 건너뛰기</a>
  <div class="pull-indicator" id="pullIndicator" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></div>
  <header class="d-hdr">
    <h1 class="d-brand" id="workspaceTitle">워크스페이스</h1>
    <div class="d-datewrap" id="dateBar"></div>
    <nav class="d-tabs" role="tablist" aria-label="화면">
      <button type="button" class="d-tab" id="tabBtnToday" role="tab">오늘</button>
      <button type="button" class="d-tab" id="tabBtnProjects" role="tab">프로젝트</button>
      <button type="button" class="d-tab" id="tabBtnRecords" role="tab">아이디어·결정<span class="d-tabnum num" id="tabRecordsNum"></span></button>
      <button type="button" class="d-tab" id="tabBtnWeekly" role="tab">주간요약</button>
    </nav>
    <button type="button" id="refreshBtn" class="d-iconbtn" aria-label="새로고침" title="새로고침"><svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M14 8a6 6 0 1 1-2-4.47L14 5.2"/><path d="M14 2v3.4h-3.4"/></svg></button>
    <button type="button" id="searchEntryBtn" class="d-srch" aria-label="통합 검색" title="검색">
      <svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.25"/><path d="M10.2 10.2 14 14"/></svg><span>검색</span><kbd>⌘K</kbd>
    </button>
    <button type="button" id="settingsBtn" class="d-iconbtn d-gear" aria-label="설정" title="설정"><svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.4"/><path d="M8 1.7v1.7M8 12.6v1.7M14.3 8h-1.7M3.4 8H1.7M12.45 3.55l-1.2 1.2M4.75 11.25l-1.2 1.2M12.45 12.45l-1.2-1.2M4.75 4.75l-1.2-1.2"/></svg><i class="d-baddot" aria-hidden="true"></i></button>
  </header>
  <div id="storageBanner" class="d-banner" role="status" hidden></div>
  <div class="page">
    <div class="grid" id="gridToday">
      <aside class="col col-left d-rail" aria-label="오늘 옆줄">
        <!-- 한 줄 요약은 화면에서 내렸다(숫자는 탭 이름 옆과 카드 제목 옆으로 갔다).
             옛 자리에 있던 숫자 칸은 갱신 코드가 그대로 쓰도록 숨겨 둔 채 남는다. -->
        <div class="d-quiet" id="railSummary" hidden>
          결정 검토 <span class="num" id="decisionCount">0</span> · 확인 대기 <span class="num" id="waitingCount">0</span>
        </div>

        <section class="d-rsec" id="calendarZone">
          <div class="d-rhd"><span>오늘 미팅</span><span class="n num" id="calendarSectionCount">0</span></div>
          <div id="calendarList"></div>
        </section>

        <section class="d-rsec" id="reminderZone" hidden>
          <div class="d-rhd" id="reminderHeading"><span>리마인드</span><span class="n num" id="reminderSectionCount">0</span></div>
          <div id="reminderList"></div>
        </section>

        <!-- 확인 대기: 후속 알림이 카드 첫 줄로 올라오고, 입력칸은 카드 맨 아래에 있다 -->
        <section class="d-rsec" id="waitingZone">
          <div class="d-rhd" id="waitingHeading"><span>확인 대기</span><span class="n num" id="waitingSectionCount">0</span></div>
          <div id="waitingList"></div>
          <input type="text" class="d-qa" id="waitingInput" placeholder="+ 확인 대기 추가" aria-label="확인 대기 추가" />
        </section>
      </aside>

      <main class="col col-center">
        <div id="inboxZone" hidden>
          <div class="d-sechd" id="inboxHeading">새로 들어온 것<span class="n num" id="inboxCount">0</span>
            <button type="button" class="d-headnum" id="createdTodayBtn" aria-label="오늘 들어온 항목 모아 보기" hidden>오늘 신규 <span class="num" id="createdTodayCount">0</span></button>
          </div>
          <div class="d-inbox" id="inboxList"></div>
        </div>

        <div id="todayTaskZone" tabindex="-1">
          <!-- 머리줄: 제목 + 파란 개수 칩 + `19개 중 5개 끝냈어요 · 2개 미룰까요?`
               / 오른쪽 `나중에 할 일 N` + ⋯(보기 전환·여러 개 선택). -->
          <div class="d-lhd">
            <h2>오늘 할 일</h2>
            <span class="sub num"><span class="cnt" id="todayTaskCount">0</span><span id="todayDoneSummary"></span><span id="suggestSlot"></span></span>
            <span class="sp"></span>
            <button type="button" class="d-btn" id="laterTaskToggle" aria-expanded="false" aria-controls="laterTaskDrawer">나중에 할 일 <span class="num" id="laterTaskSectionCount">0</span></button>
            <span id="todayHeadMore"></span>
          </div>
          <div id="suggestZone" hidden></div>
          <div class="task-content-layout">
            <div class="d-list" id="todayListSurface">
              <div class="d-qaf">
                <svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>
                <input type="text" id="todayTaskInput" placeholder="오늘 할 일 추가 — Enter" aria-label="오늘 할 일 추가" />
              </div>
              <div id="todayTaskList"></div>
            </div>
            <aside id="taskDetailPanel" class="d-side" hidden aria-label="선택한 항목 상세"></aside>
          </div>
        </div>
      </main>
    </div>

    <!-- 프로젝트 탭 — 왼쪽은 프로젝트 목록, 오른쪽은 고른 프로젝트 하나(상세 패널은 오늘 탭과 같은 오른쪽 자리) -->
    <div class="grid" id="gridProjects" hidden>
      <aside class="d-plist" id="projectList" aria-label="프로젝트 목록"></aside>
      <main class="d-pmain">
        <div class="d-pwrap" id="projectZone">
          <div class="task-content-layout">
            <div id="projectBody"></div>
            <aside id="projectDetailPanel" class="d-side" hidden aria-label="선택한 항목 상세"></aside>
          </div>
        </div>
      </main>
    </div>

    <!-- 아이디어·결정 탭 — 두 열(아이디어 | 결정), 좁은 화면에서는 한 열로 쌓인다.
         결정 줄에만 `PRD 반영함` 체크가 있고, 반영한 결정은 아래 접힌 구역으로 내려간다. -->
    <div class="d-reccols" id="gridRecords" hidden>
      <section class="d-reccol" aria-labelledby="ideaColHead">
        <div class="d-lhd"><h2 id="ideaColHead">아이디어</h2><span class="sub num" id="ideaCount">0</span></div>
        <div class="d-list">
          <div class="d-qaf">
            <svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>
            <input type="text" id="ideaInput" placeholder="아이디어 추가 — Enter" aria-label="아이디어 추가" />
          </div>
          <div id="ideaList"></div>
        </div>
      </section>

      <section class="d-reccol" aria-labelledby="decisionColHead">
        <div class="d-lhd"><h2 id="decisionColHead">결정</h2><span class="sub num" id="decisionSectionCount">0</span><span class="d-quietnum num" id="decisionPendingNote"></span></div>
        <div class="d-list">
          <div class="d-qaf">
            <svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 3.2v9.6M3.2 8h9.6"/></svg>
            <input type="text" id="decisionInput" placeholder="결정 추가 — Enter" aria-label="결정 추가" />
          </div>
          <div id="decisionList"></div>
        </div>

        <div class="d-arch" id="decisionArchiveZone">
          <button type="button" class="d-grp tog" id="decisionArchiveToggle" aria-expanded="false" aria-controls="decisionArchiveBody">
            <svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M6 3.5 10.5 8 6 12.5"/></svg>
            <span class="gl">반영 완료</span><span class="n num" id="decisionArchiveCount">0</span>
          </button>
          <div id="decisionArchiveBody" hidden>
            <input type="search" id="decisionArchiveSearch" class="d-archq" placeholder="반영 완료 검색 (내용·프로젝트·지라)" aria-label="반영 완료한 결정 검색" autocomplete="off" />
            <div class="d-list"><div id="decisionArchiveList"></div></div>
          </div>
        </div>
      </section>
    </div>

    <!-- 주간요약 탭 — 주차 목록 | 보고 문서 | 슬랙 미리보기.
         평일에는 읽는 화면이고, 금요일에 문장을 고쳐 오른쪽 미리보기 그대로 슬랙에 붙인다. -->
    <div id="gridWeekly" hidden>
      <aside class="rp-weeks" aria-label="주차 목록">
        <div class="d-grp"><span class="gl">주차</span><span class="n num" id="weeklyReportCount">0</span></div>
        <div id="weeklyReportNav"></div>
      </aside>
      <main class="rp-doc" id="weeklyReportDetail"></main>
      <aside class="rp-slack" id="weeklyReportPreview" aria-label="슬랙 미리보기"></aside>
    </div>
  </div>

  <!-- 문장 묶기 중에만 뜨는 아래 고정 막대(오늘 탭의 일괄 정리 막대와 같은 부품) -->
  <div class="d-selbar" id="reportMergeBar" role="group" aria-label="보고 문장 묶기" hidden></div>

  <!-- 나중에 할 일 서랍 — 헤더 아래 오른쪽에 붙어서 열리고, 넓은 화면에서는 본문을 덮지 않고 밀어낸다 -->
  <aside class="d-drawer" id="laterTaskDrawer" aria-label="나중에 할 일" aria-hidden="true">
    <div class="d-dhd">
      <h2>나중에 할 일</h2>
      <span class="n num" id="laterDrawerCount">0</span>
      <button type="button" class="d-iconbtn" id="laterTaskClose" aria-label="나중에 할 일 닫기"><svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="d-dbody">
      <input type="text" class="d-qa" id="laterTaskInput" placeholder="나중에 할 일 추가 — Enter" aria-label="나중에 할 일 추가" />
      <div id="laterTaskList"></div>
    </div>
  </aside>

  <!-- 여러 개 선택 중에만 뜨는 아래 고정 막대. 본문 폭 안에 들어오고, 서랍이 열리면 그만큼 비켜선다 -->
  <div class="d-selbar" id="taskSelectBar" role="group" aria-label="선택한 업무 일괄 정리" hidden></div>

  <div id="liveRegion" class="d-toast" role="status" aria-live="polite" hidden></div>

  <!-- 설정 — 드물게 여는 창이라 모달 그대로 둔다(상태 / 사용법 두 칸) -->
  <dialog id="settingsDialog" class="d-modal" aria-label="설정">
    <div class="d-mhd">
      <h2>설정</h2>
      <span class="d-seg" role="group" aria-label="설정 보기">
        <button type="button" data-settings-tab="status" aria-pressed="true">상태</button>
        <button type="button" data-settings-tab="guide" aria-pressed="false">사용법</button>
      </span>
      <span class="sp"></span>
      <button type="button" class="d-iconbtn" id="settingsCloseBtn" aria-label="닫기"><svg class="d-i" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>
    <div class="d-mbody">
      <div id="settingsStatusView"></div>
      <div id="settingsGuideView" hidden></div>
    </div>
  </dialog>

<script src="/workflows.js"></script>
<script src="/report-ui.js"></script>
<script src="/app.js"></script>
</body>
</html>
