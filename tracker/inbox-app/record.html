<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>회의 녹음</title>
<link rel="icon" type="image/png" href="/app-icon.png" />
<link rel="stylesheet" href="/ui.css">
<link rel="stylesheet" href="/local/local.css">
</head>
<!-- 회의 녹음 창(1차) — 앱의 회의 패널 `● 녹음`이 작은 창으로 연다. 녹음은 이 창에서 돌고, 알약은 이 창이 띄운
     Picture-in-Picture 창이다. 그래서 앱 창을 닫거나 새로고침해도 녹음이 이어진다(이 창을 닫으면 멈춘다).
     이 페이지는 app.js를 싣지 않는다 — 앱 화면 갱신 때의 자동 새로고침이 녹음을 끊지 않게. 동작은 record-page.js. -->
<body class="rec-page">
  <main class="rp">
    <p class="rp-what"><span id="recTitle">회의 녹음</span><span class="d-itag d-beta" title="아직 써 보는 기능이에요">Beta</span></p>
    <p class="rp-when" id="recWhen"></p>
    <div class="rp-live" id="recLive" hidden>
      <span class="rec-dot" aria-hidden="true"></span>
      <span class="rp-time" id="recTime">00:00</span>
    </div>
    <p class="rp-state" id="recState" role="status" aria-live="polite"></p>
    <div class="rp-acts" id="recActs"></div>
    <p class="rp-err" id="recErr" role="alert"></p>
    <p class="rp-note" id="recNote"></p>
  </main>
  <script src="/record-page.js"></script>
</body>
</html>
