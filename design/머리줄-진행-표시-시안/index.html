<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>오늘 할 일 머리줄 진행 표시 시안</title>
<style>
@font-face { font-family: "Pretendard Variable"; font-weight: 45 920; font-display: swap; src: url("fonts/PretendardVariable.woff2") format("woff2-variations"), url("fonts/PretendardVariable.woff2") format("woff2"); }
/* 앱 토큰 그대로(ui.css) — 새 색 없음 */
:root {
  --bg: #f2f4f6; --surface: #fff; --surface-line: transparent; --field: #f2f4f6; --hover: #f4f6f8; --hair: #eef1f4;
  --text: #191f28; --muted: #4e5968; --dim: #636c78;
  --accent: #3182f6; --accent-strong: #1b64da; --accent-text: #1b64da; --accent-soft: #e8f3ff; --on-fill: #fff;
  --success: #0d7a4a; --success-bg: #e6f6ee; --success-dot: #1fae68;
  --warn: #b0560a; --warn-bg: #fff4e5; --neutral-bg: #eef1f4; --prog-track: #e9edf2; --check-line: #8b95a1;
  --soft: 0 1px 2px rgba(25,31,40,.04), 0 8px 24px rgba(25,31,40,.06);
  --r: 20px; --r-xs: 10px; --ease: cubic-bezier(0.22, 0.8, 0.3, 1);
  --font: "Pretendard Variable", Pretendard, -apple-system, "Apple SD Gothic Neo", sans-serif;
  --note: #8a3ffc;
}
:root[data-theme="dark"] {
  --bg: #15181e; --surface: #1e222a; --surface-line: #2b313b; --field: #262b34; --hover: #272c35; --hair: #2b313b;
  --text: #eaedf1; --muted: #a8b1bd; --dim: #8b95a1;
  --accent: #4b91f1; --accent-strong: #4b91f1; --accent-text: #7aa9ff; --accent-soft: #1b2a44; --on-fill: #0b1020;
  --success: #6ddba0; --success-bg: #1c3729; --success-dot: #4fd08e;
  --warn: #ffbe6b; --warn-bg: #3a2e1b; --neutral-bg: #2a2f38; --prog-track: #2b313b; --check-line: #636e7d;
  --soft: 0 1px 3px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.3);
  --note: #c9a2ff;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1320px; margin: 0 auto; padding: 28px 24px 56px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.015em; }
.lede { color: var(--muted); margin: 0 0 14px; }
.ask { background: var(--accent-soft); color: var(--accent-text); border-radius: var(--r-xs); padding: 12px 16px; font-weight: 600; margin: 0 0 18px; }
.num { font-variant-numeric: tabular-nums; }
h3 { font-size: 15px; margin: 26px 0 8px; }
.states { display: grid; gap: 22px; }
.state > .lb { font-size: 12.5px; font-weight: 600; color: var(--dim); margin: 0 0 6px; }
.quad { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 16px; }
.cell > .vn { font-size: 12px; font-weight: 700; color: var(--muted); margin: 0 0 3px 2px; }
.cell > .vn em { font-style: normal; color: var(--dim); font-weight: 500; }

/* ---------- 앱 머리줄(.d-lhd) 그대로 ---------- */
.mock { background: var(--bg); }
.d-lhd { display: flex; align-items: center; gap: 12px 10px; flex-wrap: wrap; min-height: 34px; margin: 0 0 2px; }
.d-lhd > * { flex: none; }
.d-lhd h2 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -0.015em; white-space: nowrap; }
.d-lhd .sub { display: inline-flex; align-items: center; gap: 10px; color: var(--dim); font-size: 13.5px; font-weight: 500; }
.d-lhd .sp { margin-left: auto; }
.cnt { height: 22px; display: inline-flex; align-items: center; padding: 0 9px; border-radius: 999px; background: var(--accent-soft); color: var(--accent-text); font-size: 12.5px; font-weight: 600; }
.d-btn { display: inline-flex; align-items: center; gap: 5px; height: 34px; padding: 0 13px; border: 0; border-radius: var(--r-xs); background: var(--neutral-bg); color: var(--muted); font: 600 13.5px var(--font); white-space: nowrap; }
.more { width: 28px; height: 28px; display: grid; place-items: center; color: var(--dim); }
.sug { color: var(--dim); font-size: 13.5px; font-weight: 500; text-decoration: underline; text-underline-offset: 2px; }
.sug::before { content: "· "; text-decoration: none; display: inline-block; margin-right: 2px; }
/* 카드 윗변(실제로는 .d-list + .d-topprog 3px 선) */
.strip { position: relative; height: 16px; margin-top: 6px; background: var(--surface); border: 1px solid var(--surface-line); border-bottom: 0; border-radius: var(--r) var(--r) 0 0; box-shadow: var(--soft); overflow: hidden; }
.strip::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--prog-track); }
.strip > i { position: absolute; top: 0; left: 0; height: 3px; width: var(--p, 0%); background: var(--accent); transition: width 320ms var(--ease); }
.strip.none { display: none; }

/* ---------- 시안 부품 ---------- */
.pg { display: inline-flex; align-items: center; gap: 6px; }
.n { font-size: 13.5px; font-weight: 500; color: var(--dim); font-variant-numeric: tabular-nums; white-space: nowrap; }
.n b { font-weight: 700; color: var(--muted); display: inline-block; }
.tick { animation: tick 200ms var(--ease); }
@keyframes tick { from { transform: translateY(4px); opacity: .35; } to { transform: none; opacity: 1; } }
/* A 고리 */
.ring { width: 16px; height: 16px; flex: none; transform: rotate(-90deg); overflow: visible; }
.ring .tr { fill: none; stroke: var(--prog-track); stroke-width: 2.5; }
.ring .fg { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; stroke-dasharray: 39.27; stroke-dashoffset: 39.27; transition: stroke-dashoffset 320ms var(--ease), stroke 200ms; }
.ring .disc { fill: var(--success-dot); opacity: 0; transition: opacity 200ms var(--ease); }
.ring .ck { fill: none; stroke: var(--on-fill); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; opacity: 0; transform: rotate(90deg); transform-origin: 8px 8px; transition: opacity 200ms var(--ease); }
.pg.full .ring .disc, .pg.full .ring .ck { opacity: 1; }
.pg.full .ring .fg { stroke: var(--success-dot); }
/* B 막대(주간요약 .d-uwtrack과 같은 48×4, 채움만 --accent) */
.trk { position: relative; flex: none; width: 48px; height: 4px; border-radius: 2px; background: var(--prog-track); overflow: hidden; }
.trk > i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: inherit; background: var(--accent); transition: width 320ms var(--ease), background 200ms; }
.pg.full .trk > i { background: var(--success-dot); }
/* C 칩 하나 */
.pg.c { height: 22px; padding: 0 9px 0 7px; gap: 4px; border-radius: 999px; background: var(--accent-soft); transition: background 200ms; }
.pg.c .n { font-size: 12.5px; font-weight: 600; color: var(--accent-text); }
.pg.c .n b { color: var(--accent-text); }
.pg.c .gl { width: 12px; height: 12px; flex: none; stroke: var(--accent-text); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.pg.c.full { background: var(--success-bg); }
.pg.c.full .n, .pg.c.full .n b { color: var(--success); }
.pg.c.full .gl { stroke: var(--success); }
/* 지금 */
.pg.now { gap: 10px; }
.pg.now .sent { font-size: 13.5px; font-weight: 500; color: var(--dim); }

/* 번호 표시 */
.ann { outline: 1.5px dashed var(--note); outline-offset: 3px; border-radius: 4px; position: relative; }
.ann::after { content: attr(data-n); position: absolute; left: -2px; top: -20px; font: 700 13px/1 var(--font); color: var(--note); }
.legend { display: grid; gap: 4px; margin: 14px 0 0; padding: 0; list-style: none; color: var(--muted); }
.legend li { display: flex; gap: 8px; }
.legend b { color: var(--note); flex: none; width: 22px; }
.legend ul { margin: 0; padding: 0; }
.note { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--surface-line); border-radius: var(--r); box-shadow: var(--soft); padding: 18px 20px; margin-top: 10px; }
.card h3 { margin-top: 0; }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: left; vertical-align: top; padding: 6px 10px 6px 0; border-bottom: 1px solid var(--hair); }
th { color: var(--dim); font-weight: 600; font-size: 12.5px; }
.pick { color: var(--accent-text); font-weight: 700; }
/* 눌러 보기 */
.play { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 24px; }
.tasks { display: grid; gap: 4px; align-content: start; }
.tk { display: flex; align-items: center; gap: 10px; height: 36px; padding: 0 10px; border: 0; border-radius: 12px; background: transparent; color: var(--text); font: 500 14px var(--font); text-align: left; cursor: pointer; }
.tk:hover { background: var(--hover); }
.tk .bx { width: 18px; height: 18px; border-radius: 6px; border: 1.8px solid var(--check-line); display: grid; place-items: center; flex: none; }
.tk[aria-pressed="true"] { color: var(--dim); text-decoration: line-through; }
.tk[aria-pressed="true"] .bx { background: var(--accent); border-color: var(--accent); }
.tk .bx svg { width: 12px; height: 12px; stroke: var(--on-fill); fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.tk[aria-pressed="true"] .bx svg { opacity: 1; }
.btns { display: flex; gap: 8px; margin: 10px 0 0; }
button.d-btn { cursor: pointer; font-family: var(--font); }
.bigmock { display: grid; gap: 14px; }
.bigmock .cell { background: var(--surface); border-radius: var(--r); padding: 10px 14px; box-shadow: var(--soft); }
.bigmock .mock { background: transparent; }
.bigmock .strip { display: none; }
@media (max-width: 760px) {
  .wrap { padding: 16px 16px 40px; }
  .quad { grid-template-columns: minmax(0, 1fr); }
  .play { grid-template-columns: minmax(0, 1fr); }
}
@media (prefers-reduced-motion: reduce) {
  .ring .fg, .ring .disc, .ring .ck, .trk > i, .strip > i, .pg.c { transition: none; }
  .tick { animation: none; }
}
.only-mobile { width: 390px; margin: 0; padding: 16px 16px 40px; }
.only-mobile .quad { grid-template-columns: minmax(0,1fr); }
.only-mobile .legend li { font-size: 12.5px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <h1>오늘 할 일 머리줄 — 진행 표시 시안 3안</h1>
  <p class="lede">`10개 중 1개 끝냈어요` 문장을 작은 요소로 바꾸는 시안. 앱 토큰만 쓰고 새 색·새 글꼴 없음. 가짜 데이터.</p>
  <p class="ask">사용자가 볼 것 1가지: 아래 ①②③ 중 어느 쪽이 "작게, 한눈에" 읽히는지 A·B·C 하나 고르기 (추천은 맨 아래).</p>

  <div class="states" id="states"></div>

  <ul class="legend" id="legend"></ul>

  <div class="card" id="reco"></div>

  <div class="card">
    <h3>눌러 보기 — 체크하면 숫자·고리·막대가 바뀜</h3>
    <p class="note" style="margin-top:0">모션은 320ms(카드 윗변 선과 같은 길이·곡선) + 숫자만 4px 올라오며 나타남. 시스템 설정 `동작 줄이기`이면 전부 즉시 바뀜.</p>
    <div class="play">
      <div class="tasks" id="tasks"></div>
      <div class="bigmock" id="big"></div>
    </div>
    <div class="btns"><button class="d-btn" id="all" type="button">모두 끝냄</button><button class="d-btn" id="reset" type="button">처음으로</button></div>
  </div>
</div>

<script>
const q = new URLSearchParams(location.search);
if (q.get('theme') === 'dark') document.documentElement.dataset.theme = 'dark';
else if (!q.get('theme') && matchMedia('(prefers-color-scheme: dark)').matches) document.documentElement.dataset.theme = 'dark';
if (q.get('m') === '1') document.getElementById('wrap').classList.add('only-mobile');

const MORE = '<svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor"><circle cx="3" cy="8" r="1.3"/><circle cx="8" cy="8" r="1.3"/><circle cx="13" cy="8" r="1.3"/></svg>';
const CK = '<svg class="gl" viewBox="0 0 12 12" aria-hidden="true"><path d="M2.2 6.4 4.9 9 9.8 3.2"/></svg>';
const sentence = (d, t) => `${t}개 중 ${d}개 끝냈어요`;
const R = 6.25, CIRC = 2 * Math.PI * R;

// 진행 부품 하나 — 값이 바뀌면 같은 요소를 고쳐서 transition이 돈다
function makeProg(v) {
  const el = document.createElement('span');
  if (v === 'now') {
    el.className = 'pg now';
    el.innerHTML = '<span class="cnt"></span><span class="sent"></span>';
  } else {
    el.className = 'pg ' + v;
    el.setAttribute('role', 'img');
    let lead = '';
    if (v === 'a') lead = `<svg class="ring" viewBox="0 0 16 16" aria-hidden="true"><circle class="tr" cx="8" cy="8" r="${R}"/><circle class="fg" cx="8" cy="8" r="${R}"/><circle class="disc" cx="8" cy="8" r="8"/><path class="ck" d="M4.6 8.3 7 10.6 11.4 5.6"/></svg>`;
    if (v === 'b') lead = '<span class="trk" aria-hidden="true"><i></i></span>';
    if (v === 'c') lead = CK;
    el.innerHTML = `${lead}<span class="n" aria-hidden="true"><b></b><span class="tot"></span></span>`;
  }
  return el;
}
function setProg(el, d, t) {
  const label = sentence(d, t), p = t ? d / t : 0;
  const full = t > 0 && d === t;
  if (el.classList.contains('now')) {
    const c = el.querySelector('.cnt'); c.textContent = t - d; c.hidden = full;
    el.querySelector('.sent').textContent = label;
    return;
  }
  el.setAttribute('aria-label', label);
  el.title = label;
  el.classList.toggle('full', full);
  const b = el.querySelector('b');
  if (b.textContent !== String(d)) {
    const had = b.textContent !== '';
    b.textContent = d;
    if (had) { b.classList.remove('tick'); void b.offsetWidth; b.classList.add('tick'); }
  }
  el.querySelector('.tot').textContent = '/' + t;
  const fg = el.querySelector('.fg'); if (fg) fg.style.strokeDashoffset = (CIRC * (1 - p)).toFixed(2);
  const bar = el.querySelector('.trk > i'); if (bar) bar.style.width = (p * 100) + '%';
}
function makeHead(v, d, t, o = {}) {
  const m = document.createElement('div');
  m.className = 'mock';
  const sub = document.createElement('span'); sub.className = 'sub num';
  const prog = makeProg(v);
  if (t) { setProg(prog, d, t); sub.appendChild(prog); }
  if (o.sug) { const s = document.createElement('span'); s.className = 'sug'; s.textContent = '오늘 할 만한 일 ' + o.sug + '개'; sub.appendChild(s); }
  m.innerHTML = `<div class="d-lhd"><h2>오늘 할 일</h2></div><div class="strip"><i></i></div>`;
  const hd = m.querySelector('.d-lhd');
  hd.appendChild(sub);
  hd.insertAdjacentHTML('beforeend', `<span class="sp"></span><button class="d-btn" type="button">나중에 할 일 <span class="num">${o.later ?? 13}</span></button><span class="more">${MORE}</span>`);
  const strip = m.querySelector('.strip');
  if (!t) strip.classList.add('none'); else strip.firstChild.style.setProperty('--p', Math.round(d / t * 100) + '%');
  m._prog = prog; m._strip = strip;
  return m;
}

const VARS = [
  ['now', '지금', '문장'],
  ['a', 'A', '작은 고리 + 개수'],
  ['b', 'B', '48px 막대 + 개수'],
  ['c', 'C', '칩 하나에 ✓ 개수'],
];
const STATES = [
  { id: 'zero', lb: '0개 끝냄 (0/10)', d: 0, t: 10 },
  { id: 'one', lb: '일부 (1/10)', d: 1, t: 10 },
  { id: 'half', lb: '일부 (5/10)', d: 5, t: 10 },
  { id: 'all', lb: '전부 끝냄 (10/10) — 조용한 완료 표시', d: 10, t: 10 },
  { id: 'sug', lb: '오늘 할 일이 적어 `오늘 할 만한 일` 링크가 같이 설 때 (1/3)', d: 1, t: 3, sug: 2, annot: true },
  { id: 'none', lb: '오늘 할 일 0개 — 진행 표시 없음 (카드 윗변 선도 없음)', d: 0, t: 0 },
];
const only = (q.get('states') || '').split(',').filter(Boolean);
const vonly = (q.get('vars') || '').split(',').filter(Boolean);
const host = document.getElementById('states');
STATES.filter(s => !only.length || only.includes(s.id)).forEach(s => {
  const sec = document.createElement('section'); sec.className = 'state';
  sec.innerHTML = `<div class="lb">${s.lb}</div><div class="quad"></div>`;
  const quad = sec.querySelector('.quad');
  VARS.filter(v => !vonly.length || vonly.includes(v[0])).forEach(v => {
    const cell = document.createElement('div'); cell.className = 'cell';
    cell.innerHTML = `<div class="vn">${v[1]} <em>${v[2]}</em></div>`;
    const head = makeHead(v[0], s.d, s.t, { sug: s.sug, later: s.t ? 13 : 0 });
    cell.appendChild(head);
    if (!s.t) head.querySelector('.d-btn').style.display = 'none';
    if (s.annot) {
      const mark = (sel, n) => { const e = head.querySelector(sel); if (e) { e.classList.add('ann'); e.dataset.n = n; } };
      if (v[0] === 'now') { mark('.cnt', '①'); mark('.sent', '②'); mark('.strip', '③'); }
      if (v[0] === 'a') { mark('.ring', '④'); mark('.n', '⑤'); }
      if (v[0] === 'b') { mark('.trk', '⑥'); mark('.n', '⑦'); }
      if (v[0] === 'c') { mark('.pg.c', '⑧'); mark('.gl', '⑨'); }
    }
    quad.appendChild(cell);
  });
  host.appendChild(sec);
});

const LEG = [
  ['①', '지금: 파란 칩 = 남은 개수(3-1=2). 같은 줄 문장에도 개수가 또 나옴 — 숫자가 두 번 보임'],
  ['②', '지금: 문장 `3개 중 1개 끝냈어요` — 읽어야 하는 한 줄, 머리줄에서 가장 길다'],
  ['③', '지금(모든 안 공통): 카드 윗변 3px 선은 이미 진행을 그리고 있음 — 새 시안은 이 선을 그대로 둠'],
  ['④', 'A: 16px 고리 — 파랑 호가 차오름, 다 끝나면 초록 원 + ✓ (색만이 아니라 모양도 바뀜)'],
  ['⑤', 'A: `1/3` — 끝낸 수만 굵게. 남은 개수 칩은 없앰(남은 수 = 뒤 숫자 − 앞 숫자)'],
  ['⑥', 'B: 48px×4px 막대 — 주간요약 주차 목록의 끝낸 일 막대(`.d-uwtrack`)와 같은 부품, 채움만 파랑'],
  ['⑦', 'B: `1/3` — 막대 오른쪽 숫자. 윗변 3px 선과 막대가 같은 값을 한 화면에서 두 번 그림(중복)'],
  ['⑧', 'C: 파란 칩 하나가 `✓ 1/3`으로 바뀜 — 남은 개수 칩 자리를 그대로 씀, 새 부품 없음'],
  ['⑨', 'C: ✓ 모양이 "끝낸 쪽이 앞 숫자"라는 뜻을 단어 없이 알림. 다 끝나면 칩이 초록(`--success`)으로'],
];
document.getElementById('legend').innerHTML = LEG.map(l => `<li><b>${l[0]}</b><span>${l[1]}</span></li>`).join('');

document.getElementById('reco').innerHTML = `
<h3>추천 — C (칩 하나에 ✓ 1/10)</h3>
<p style="margin:0 0 10px">이유: 카드 윗변의 3px 선이 이미 "얼마나 찼는지"를 그리고 있어서 머리줄에는 숫자만 있으면 됨. C는 파란 칩 자리를 그대로 쓰므로 머리줄이 지금보다 길어지지 않고, 새 부품·새 색이 없음.</p>
<table>
<tr><th>안</th><th>남은 개수 칩과의 중복 정리</th><th>약점</th></tr>
<tr><td>A 고리</td><td>칩 삭제, 고리+숫자가 대신함</td><td>16px 호는 1/10과 5/10를 가려 읽기엔 작음, 새 SVG 부품, 윗변 선과 이중 그림</td></tr>
<tr><td>B 막대</td><td>칩 삭제, 막대+숫자가 대신함</td><td>윗변 3px 선과 모양이 거의 같아 같은 값을 두 번 보임(가장 중복), 한 줄이 가장 길어 390px에서 먼저 줄바꿈</td></tr>
<tr><td class="pick">C 칩 (추천)</td><td>파란 칩 = 이제 끝낸/전체. 남은 개수는 뺌(줄 수로 알 수 있음)</td><td>✓ 1/10은 단어가 없어 처음엔 "몇 개 중 몇 개"로 읽는 데 한 번 배움이 필요(hover title·화면 읽기엔 문장). DESIGN의 "파란 칩 = 남은 개수" 규칙이 바뀜</td></tr>
</table>`;

// 눌러 보기
const T = 10, tasksEl = document.getElementById('tasks'), big = document.getElementById('big');
const done = Array(T).fill(false); done[0] = true;
const names = ['주간 리포트 초안 정리', '배포 일정 확인', '디자인 리뷰 답변', '회의 노트 정리', '지라 티켓 상태 갱신', '고객 문의 회신', '분기 목표 문서 수정', '릴리스 노트 검토', '온보딩 자료 업데이트', '팀 공유 메모 보내기'];
const heads = VARS.map(v => {
  const cell = document.createElement('div'); cell.className = 'cell';
  cell.innerHTML = `<div class="vn">${v[1]} <em>${v[2]}</em></div>`;
  const h = makeHead(v[0], 1, T, { later: 13 }); cell.appendChild(h); big.appendChild(cell); return h;
});
const rows = names.map((n, i) => {
  const b = document.createElement('button'); b.type = 'button'; b.className = 'tk';
  b.innerHTML = `<span class="bx"><svg viewBox="0 0 12 12"><path d="M2.2 6.4 4.9 9 9.8 3.2"/></svg></span><span>${n}</span>`;
  b.onclick = () => { done[i] = !done[i]; sync(); };
  tasksEl.appendChild(b); return b;
});
function sync() {
  const d = done.filter(Boolean).length;
  rows.forEach((b, i) => b.setAttribute('aria-pressed', done[i]));
  heads.forEach(h => { setProg(h._prog, d, T); h._strip.firstChild.style.setProperty('--p', Math.round(d / T * 100) + '%'); });
}
document.getElementById('all').onclick = () => { done.fill(true); sync(); };
document.getElementById('reset').onclick = () => { done.fill(false); done[0] = true; sync(); };
sync();
</script>
